<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lpm-title">
<title id="lpm-title">Diagram of a longest-prefix-match routing table lookup for destination 192.168.2.10</title>
<defs>
  <marker id="lpmArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0L10,5L0,10z" fill="#5B6B78"/>
  </marker>
</defs>
<style>
  .lbl { font-family: system-ui, -apple-system, sans-serif; fill: #1A1A1A; font-size: 13px; }
  .lbl-sm { font-family: system-ui, -apple-system, sans-serif; fill: #5B6B78; font-size: 12px; }
  .lbl-w { font-family: system-ui, -apple-system, sans-serif; fill: #ffffff; font-size: 13px; font-weight: 600; }
  .lbl-title { font-family: system-ui, -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 600; }
  .mono { font-family: monospace; }
</style>

<rect x="4" y="4" width="892" height="452" rx="10" fill="#ffffff" stroke="#0C3274" stroke-width="2"/>
<rect x="4" y="4" width="892" height="32" rx="10" fill="#0C3274"/>
<rect x="4" y="20" width="892" height="16" fill="#0C3274"/>
<text x="20" y="25" class="lbl-title">Longest prefix match — why the /24 entry wins for 192.168.2.10</text>

<!-- incoming packet -->
<rect x="350" y="52" width="200" height="46" rx="6" fill="#FFF8F1" stroke="#E8792A" stroke-width="2"/>
<text x="450" y="72" text-anchor="middle" class="lbl" style="font-weight:700;">Incoming packet</text>
<text x="450" y="90" text-anchor="middle" class="lbl-sm mono">Dest IP: 192.168.2.10</text>

<line x1="450" y1="98" x2="450" y2="130" stroke="#5B6B78" stroke-width="2" marker-end="url(#lpmArrow)"/>

<!-- table header -->
<text x="100" y="146" class="lbl-sm" style="font-weight:600;">Code</text>
<text x="180" y="146" class="lbl-sm" style="font-weight:600;">Network</text>
<text x="430" y="146" class="lbl-sm" style="font-weight:600;">Next-hop</text>
<text x="600" y="146" class="lbl-sm" style="font-weight:600;">Prefix</text>
<text x="700" y="146" class="lbl-sm" style="font-weight:600;">Does it match?</text>

<!-- Row 1: /16, matches but loses -->
<rect x="90" y="156" width="740" height="56" rx="6" fill="#FAFBFC" stroke="#D7E1E8"/>
<text x="100" y="190" class="lbl-sm mono" style="font-weight:600;">S</text>
<text x="180" y="190" class="lbl-sm mono">192.168.0.0</text>
<text x="430" y="190" class="lbl-sm mono">via 10.0.0.2</text>
<text x="600" y="190" class="lbl-sm mono">/16</text>
<text x="700" y="184" class="lbl-sm">matches —</text>
<text x="700" y="200" class="lbl-sm">but shorter prefix</text>

<!-- Row 2: /24, winner -->
<rect x="90" y="222" width="740" height="60" rx="6" fill="#E3F3F1" stroke="#E8792A" stroke-width="3"/>
<text x="100" y="258" class="lbl mono" style="font-weight:700;fill:#0C3274;">S</text>
<text x="180" y="258" class="lbl mono" style="font-weight:700;fill:#0C3274;">192.168.2.0</text>
<text x="430" y="258" class="lbl mono" style="font-weight:700;fill:#0C3274;">via 10.0.0.2</text>
<text x="600" y="258" class="lbl mono" style="font-weight:700;fill:#0C3274;">/24</text>
<text x="700" y="252" class="lbl" style="font-weight:700;fill:#E8792A;">WINS —</text>
<text x="700" y="270" class="lbl" style="font-weight:700;fill:#E8792A;">longest prefix</text>

<!-- Row 3: /0 default, matches but loses -->
<rect x="90" y="294" width="740" height="56" rx="6" fill="#FAFBFC" stroke="#D7E1E8"/>
<text x="100" y="328" class="lbl-sm mono" style="font-weight:600;">S*</text>
<text x="180" y="328" class="lbl-sm mono">0.0.0.0</text>
<text x="430" y="328" class="lbl-sm mono">via 203.0.113.2</text>
<text x="600" y="328" class="lbl-sm mono">/0</text>
<text x="700" y="322" class="lbl-sm">matches (default) —</text>
<text x="700" y="338" class="lbl-sm">but shortest prefix</text>

<!-- outcome -->
<line x1="820" y1="252" x2="820" y2="380" stroke="#00A79E" stroke-width="2"/>
<line x1="820" y1="380" x2="700" y2="380" stroke="#00A79E" stroke-width="2" marker-end="url(#lpmArrow)"/>
<rect x="500" y="360" width="200" height="46" rx="6" fill="#00A79E"/>
<text x="600" y="380" text-anchor="middle" class="lbl-w">Forward out</text>
<text x="600" y="397" text-anchor="middle" class="lbl-w mono" style="font-size:12px;">via 10.0.0.2</text>

<text x="24" y="430" class="lbl-sm" style="font-style:italic;">Schematic — the router compares prefix length across all matching entries, not rule order.</text>
</svg>
