<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pt-overview-title">
<title id="pt-overview-title">Schematic diagram of the Packet Tracer window layout</title>
<style>
  .lbl { font-family: system-ui, -apple-system, sans-serif; fill: #1A1A1A; }
  .lbl-sm { font-family: system-ui, -apple-system, sans-serif; fill: #5B6B78; font-size: 12px; }
  .lbl-title { font-family: system-ui, -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 600; }
  .panel { fill: #ffffff; stroke: #D7E1E8; stroke-width: 1.5; }
  .panel-active { fill: #E3F3F1; stroke: #00A79E; stroke-width: 1.5; }
  .panel-ghost { fill: #F6F8FA; stroke: #D7E1E8; stroke-width: 1.5; stroke-dasharray: 5 4; opacity: 0.85; }
</style>

<!-- window frame -->
<rect x="4" y="4" width="892" height="552" rx="10" fill="#ffffff" stroke="#0C3274" stroke-width="2"/>

<!-- title bar -->
<rect x="4" y="4" width="892" height="32" rx="10" fill="#0C3274"/>
<rect x="4" y="20" width="892" height="16" fill="#0C3274"/>
<text x="20" y="25" class="lbl-title">Cisco Packet Tracer — Untitled Project*</text>
<circle cx="850" cy="20" r="5" fill="#00A79E"/>
<circle cx="868" cy="20" r="5" fill="#E3F3F1"/>

<!-- menu / toolbar strip -->
<rect x="4" y="36" width="892" height="26" fill="#F6F8FA" stroke="#D7E1E8" stroke-width="1"/>
<text x="20" y="53" class="lbl-sm">File   Edit   View   Tools   Extensions   Simulation   Help</text>

<!-- Logical / Physical workspace tabs -->
<rect x="16" y="70" width="86" height="24" rx="4" class="panel-active"/>
<text x="59" y="86" text-anchor="middle" class="lbl-sm" style="fill:#0C3274;font-weight:600;">Logical</text>
<rect x="106" y="70" width="86" height="24" rx="4" class="panel"/>
<text x="149" y="86" text-anchor="middle" class="lbl-sm">Physical</text>

<!-- Realtime / Simulation toggle -->
<rect x="700" y="70" width="180" height="24" rx="12" class="panel"/>
<rect x="700" y="70" width="90" height="24" rx="12" fill="#E3F3F1"/>
<text x="745" y="86" text-anchor="middle" class="lbl-sm" style="fill:#0C3274;font-weight:600;">Realtime</text>
<text x="835" y="86" text-anchor="middle" class="lbl-sm">Simulation</text>

<!-- main workspace canvas -->
<rect x="16" y="102" width="664" height="322" rx="6" fill="#FAFBFC" stroke="#D7E1E8" stroke-width="1.5"/>
<text x="348" y="128" text-anchor="middle" class="lbl-sm" style="font-size:13px;font-weight:600;fill:#5B6B78;">Workspace / Topology Canvas</text>

<!-- sample devices + cable, just to suggest content -->
<rect x="140" y="220" width="34" height="26" rx="3" fill="#0C3274"/>
<text x="157" y="264" text-anchor="middle" class="lbl-sm">PC0</text>
<rect x="480" y="220" width="34" height="26" rx="3" fill="#0C3274"/>
<text x="497" y="264" text-anchor="middle" class="lbl-sm">PC1</text>
<line x1="174" y1="233" x2="480" y2="233" stroke="#00A79E" stroke-width="2"/>
<circle cx="327" cy="233" r="4" fill="#00A79E"/>

<!-- Physical / Config / CLI tabs (conditional panel) -->
<rect x="696" y="102" width="184" height="322" rx="6" class="panel-ghost"/>
<text x="788" y="130" text-anchor="middle" class="lbl-sm" style="font-weight:600;">Physical / Config / CLI</text>
<text x="788" y="148" text-anchor="middle" class="lbl-sm">tabs — appear when a</text>
<text x="788" y="164" text-anchor="middle" class="lbl-sm">device is selected</text>

<!-- device category bar -->
<rect x="16" y="440" width="278" height="98" rx="6" class="panel"/>
<text x="30" y="460" class="lbl-sm" style="font-weight:600;">Device Category Bar</text>
<rect x="30" y="470" width="36" height="30" rx="3" fill="#E3F3F1" stroke="#00A79E"/>
<rect x="72" y="470" width="36" height="30" rx="3" fill="#E3F3F1" stroke="#D7E1E8"/>
<rect x="114" y="470" width="36" height="30" rx="3" fill="#E3F3F1" stroke="#D7E1E8"/>
<rect x="156" y="470" width="36" height="30" rx="3" fill="#E3F3F1" stroke="#D7E1E8"/>
<rect x="198" y="470" width="36" height="30" rx="3" fill="#E3F3F1" stroke="#D7E1E8"/>
<text x="30" y="516" class="lbl-sm">Routers · Switches · End</text>
<text x="30" y="530" class="lbl-sm">Devices · WAN Emul. · Connections</text>

<!-- device list -->
<rect x="304" y="440" width="196" height="98" rx="6" class="panel"/>
<text x="318" y="460" class="lbl-sm" style="font-weight:600;">Device List</text>
<text x="318" y="478" class="lbl-sm">models within the</text>
<text x="318" y="494" class="lbl-sm">selected category</text>
<text x="318" y="514" class="lbl-sm">(e.g. Cisco 1841, 2811,</text>
<text x="318" y="528" class="lbl-sm">2960)</text>

<!-- cable palette (conditional) -->
<rect x="510" y="440" width="370" height="98" rx="6" class="panel-ghost"/>
<text x="524" y="460" class="lbl-sm" style="font-weight:600;">Cable Palette</text>
<text x="524" y="478" class="lbl-sm">only visible when the</text>
<text x="524" y="494" class="lbl-sm">"Connections" category is selected —</text>
<text x="524" y="510" class="lbl-sm">Straight-Through, Crossover, Console,</text>
<text x="524" y="526" class="lbl-sm">Serial DCE/DTE, Automatic</text>

<text x="16" y="552" class="lbl-sm" style="font-style:italic;">*Schematic layout for orientation — not a live screenshot. Panel positions match your installed version closely but may vary slightly by release.</text>
</svg>
