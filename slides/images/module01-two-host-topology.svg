<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="twohost-title">
<title id="twohost-title">Diagram of the minimal two-host lab topology: two PCs on one switch, same subnet, no gateway needed</title>
<style>
  .lbl { font-family: system-ui, -apple-system, sans-serif; fill: #1A1A1A; font-size: 14px; }
  .lbl-sm { font-family: system-ui, -apple-system, sans-serif; fill: #5B6B78; font-size: 13px; }
  .lbl-w { font-family: system-ui, -apple-system, sans-serif; fill: #ffffff; font-size: 12px; font-weight: 600; }
  .lbl-title { font-family: system-ui, -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 600; }
  .dev { fill: #0C3274; }
</style>

<rect x="4" y="4" width="892" height="412" rx="10" fill="#ffffff" stroke="#0C3274" stroke-width="2"/>
<rect x="4" y="4" width="892" height="32" rx="10" fill="#0C3274"/>
<rect x="4" y="20" width="892" height="16" fill="#0C3274"/>
<text x="20" y="25" class="lbl-title">Minimal two-host network - one LAN, no router needed</text>

<rect x="24" y="52" width="852" height="300" rx="8" fill="#E3F3F1" stroke="#00A79E"/>
<text x="450" y="76" text-anchor="middle" class="lbl" style="font-weight:700;fill:#0C3274;">192.168.1.0/24</text>

<rect x="120" y="150" width="80" height="40" rx="5" class="dev"/>
<text x="160" y="175" text-anchor="middle" class="lbl-w">PC0</text>
<rect x="620" y="150" width="80" height="40" rx="5" class="dev"/>
<text x="660" y="175" text-anchor="middle" class="lbl-w">PC1</text>

<rect x="390" y="230" width="120" height="34" rx="5" fill="#5B6B78"/>
<text x="450" y="251" text-anchor="middle" class="lbl-w">Switch0</text>

<line x1="160" y1="190" x2="435" y2="230" stroke="#145DA0" stroke-width="2.5"/>
<line x1="660" y1="190" x2="465" y2="230" stroke="#145DA0" stroke-width="2.5"/>

<rect x="80" y="200" width="160" height="60" rx="6" fill="#ffffff" stroke="#D7E1E8"/>
<text x="160" y="218" text-anchor="middle" class="lbl-sm" style="font-weight:600;">IP: 192.168.1.10</text>
<text x="160" y="236" text-anchor="middle" class="lbl-sm">Mask: 255.255.255.0</text>
<text x="160" y="254" text-anchor="middle" class="lbl-sm">Gateway: none needed</text>

<rect x="580" y="200" width="160" height="60" rx="6" fill="#ffffff" stroke="#D7E1E8"/>
<text x="660" y="218" text-anchor="middle" class="lbl-sm" style="font-weight:600;">IP: 192.168.1.20</text>
<text x="660" y="236" text-anchor="middle" class="lbl-sm">Mask: 255.255.255.0</text>
<text x="660" y="254" text-anchor="middle" class="lbl-sm">Gateway: none needed</text>

<text x="450" y="300" text-anchor="middle" class="lbl-sm" style="font-style:italic;">Same /24, same switch - no default gateway required for this ping to work.</text>

<rect x="24" y="322" width="852" height="18" fill="none"/>
<text x="24" y="380" class="lbl-sm" style="font-weight:600;">ping 192.168.1.20 from PC0 proves: NIC is up, cabling is good, IP configuration is correct on both</text>
<text x="24" y="398" class="lbl-sm">ends, and Layer 3 (ARP + ICMP) works - with zero routing involved yet.</text>
</svg>
