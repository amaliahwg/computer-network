<svg viewBox="0 0 900 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
<title id="t">Schematic of the RIPv2 configuration session on R0</title>
<style>
  .lbl-title { font-family: system-ui, -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 600; }
  .lbl-sm { font-family: system-ui, -apple-system, sans-serif; fill: #5B6B78; font-size: 12px; }
  .term { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 12.5px; fill: #F6F8FA; white-space: pre; }
  .term-hi { fill: #00A79E; font-weight: 600; }
  .term-new { fill: #FFC27A; }
  .cap { font-family: system-ui, -apple-system, sans-serif; fill: #FFC27A; font-size: 12px; font-weight: 600; }
</style>
<rect x="4" y="4" width="892" height="242" rx="10" fill="#ffffff" stroke="#0C3274" stroke-width="2"/>
<rect x="4" y="4" width="892" height="32" rx="10" fill="#0C3274"/>
<rect x="4" y="20" width="892" height="16" fill="#0C3274"/>
<text x="20" y="25" class="lbl-title">R0 - CLI (Step 3: RIPv2 on R0)</text>
<rect x="16" y="44" width="868" height="162" rx="6" fill="#0C3274" stroke="#00A79E" stroke-width="1.5"/>
<text x="30" y="66" class="term" xml:space="preserve"><tspan class="term-hi">R0#</tspan> configure terminal</text>
<text x="30" y="84" class="term" xml:space="preserve"><tspan class="term-hi">R0(config)#</tspan> router rip</text>
<text x="30" y="102" class="term" xml:space="preserve"><tspan class="term-hi">R0(config-router)#</tspan> version 2</text>
<text x="30" y="120" class="term" xml:space="preserve"><tspan class="term-hi">R0(config-router)#</tspan> network 192.168.1.0</text>
<text x="30" y="138" class="term" xml:space="preserve"><tspan class="term-hi">R0(config-router)#</tspan> network 10.0.0.0</text>
<text x="30" y="156" class="term" xml:space="preserve"><tspan class="term-hi">R0(config-router)#</tspan> no auto-summary</text>
<text x="30" y="174" class="term" xml:space="preserve"><tspan class="term-hi">R0(config-router)#</tspan> end</text>
<text x="30" y="192" class="term" xml:space="preserve"><tspan class="term-hi">R0#</tspan> show ip route</text>
<text x="16" y="230" class="lbl-sm" style="font-style:italic;">*Schematic layout - not a live screenshot. R1 and R2 use different network lines - see the per-router table in Step 3.</text>
</svg>
