<svg viewBox="0 0 900 295" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m5ra-title">
<title id="m5ra-title">R0 routing table after adding the static route to 192.168.2.0/24</title>
<style>
  .lbl-sm { font-family: system-ui, -apple-system, sans-serif; fill: #5B6B78; font-size: 12px; }
  .lbl-title { font-family: system-ui, -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 600; }
  .cap { font-family: system-ui, -apple-system, sans-serif; fill: #0C3274; font-size: 13px; font-weight: 600; }
  .term { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 12.5px; fill: #F6F8FA; }
  .term-hi { fill: #00A79E; font-weight: 600; }
  .term-dim { fill: #B8C4CC; }
  .term-bad { fill: #FF9E9E; }
  .term-ok { fill: #7FE0C3; }
</style>
<rect x="4" y="4" width="892" height="287" rx="10" fill="#ffffff" stroke="#0C3274" stroke-width="2"/>
<rect x="4" y="4" width="892" height="32" rx="10" fill="#0C3274"/>
<rect x="4" y="20" width="892" height="16" fill="#0C3274"/>
<text x="20" y="25" class="lbl-title">R0 - CLI - Part B (after static route)</text>
<circle cx="850" cy="20" r="5" fill="#00A79E"/>
<circle cx="868" cy="20" r="5" fill="#E3F3F1"/>
<rect x="16" y="48" width="868" height="191" rx="6" fill="#0C3274" stroke="#00A79E" stroke-width="1.5"/>
<text xml:space="preserve" x="30" y="70" class="term"><tspan class="term-hi">R0#</tspan> show ip route</text>
<text xml:space="preserve" x="30" y="88" class="term term-dim">Gateway of last resort is not set</text>
<text xml:space="preserve" x="30" y="115" class="term">      10.0.0.0/8 is variably subnetted, 2 subnets, 2 masks</text>
<text xml:space="preserve" x="30" y="133" class="term"><tspan class="term-hi">C</tspan>        10.0.0.0/30 is directly connected, GigabitEthernet0/1</text>
<text xml:space="preserve" x="30" y="151" class="term"><tspan class="term-hi">L</tspan>        10.0.0.1/32 is directly connected, GigabitEthernet0/1</text>
<text xml:space="preserve" x="30" y="169" class="term">      192.168.1.0/24 is variably subnetted, 2 subnets, 2 masks</text>
<text xml:space="preserve" x="30" y="187" class="term"><tspan class="term-hi">C</tspan>        192.168.1.0/24 is directly connected, GigabitEthernet0/0</text>
<text xml:space="preserve" x="30" y="205" class="term"><tspan class="term-hi">L</tspan>        192.168.1.1/32 is directly connected, GigabitEthernet0/0</text>
<text xml:space="preserve" x="30" y="223" class="term"><tspan class="term-hi">S</tspan>     192.168.2.0/24 [1/0] via 10.0.0.2</text>
<text x="16" y="269" class="lbl-sm" style="font-style:italic;">*Schematic layout - not a live screenshot. [1/0] = [administrative distance / metric]: static routes have distance 1 and metric 0.</text>
</svg>
