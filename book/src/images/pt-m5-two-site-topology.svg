<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="topo5-title">
<title id="topo5-title">Module 5 topology: Seoul LAN and Busan LAN joined by a WAN link between routers R0 and R1, with ISP router R2 added in Part C</title>
<style>
  .lbl { font-family: system-ui, -apple-system, sans-serif; fill: #1A1A1A; font-size: 13px; }
  .lbl-sm { font-family: system-ui, -apple-system, sans-serif; fill: #5B6B78; font-size: 12px; }
  .lbl-w { font-family: system-ui, -apple-system, sans-serif; fill: #ffffff; font-size: 13px; font-weight: 600; }
  .lbl-title { font-family: system-ui, -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 600; }
  .dev { fill: #0C3274; }
  .lk { stroke: #5B6B78; stroke-width: 2.5; }
  .ip { font-family: "SFMono-Regular", Consolas, Menlo, monospace; fill: #1A1A1A; font-size: 11.5px; }
  .pt { font-family: "SFMono-Regular", Consolas, Menlo, monospace; fill: #0C3274; font-size: 11.5px; font-weight: 600; }
</style>
<rect x="4" y="4" width="892" height="512" rx="10" fill="#ffffff" stroke="#0C3274" stroke-width="2"/>
<rect x="4" y="4" width="892" height="32" rx="10" fill="#0C3274"/>
<rect x="4" y="20" width="892" height="16" fill="#0C3274"/>
<text x="20" y="25" class="lbl-title">Two-site topology - Seoul (LAN A) and Busan (LAN B) joined by a WAN link</text>
<rect x="20" y="52" width="250" height="250" rx="8" fill="#E3F3F1" stroke="#00A79E"/>
<text x="145" y="74" text-anchor="middle" class="lbl" style="font-weight:700;fill:#0C3274;">Site A - Seoul: 192.168.1.0/24</text>
<rect x="630" y="52" width="250" height="250" rx="8" fill="#E3F3F1" stroke="#00A79E"/>
<text x="755" y="74" text-anchor="middle" class="lbl" style="font-weight:700;fill:#0C3274;">Site B - Busan: 192.168.2.0/24</text>
<line x1="85" y1="139" x2="85" y2="215" class="lk"/>
<line x1="125" y1="230" x2="300" y2="230" class="lk"/>
<line x1="390" y1="230" x2="510" y2="230" class="lk" style="stroke:#E8792A;stroke-width:3.5;"/>
<line x1="600" y1="230" x2="775" y2="230" class="lk"/>
<line x1="815" y1="139" x2="815" y2="215" class="lk"/>
<rect x="45" y="105" width="80" height="34" rx="4" class="dev"/>
<text x="85" y="127" text-anchor="middle" class="lbl-w">PC0</text>

<rect x="45" y="215" width="80" height="30" rx="4" fill="#5B6B78"/>
<text x="85" y="235" text-anchor="middle" class="lbl-w">SW0</text>
<text x="98" y="150" class="ip">192.168.1.10/24</text>
<text x="98" y="166" class="ip">GW 192.168.1.1</text>
<rect x="300" y="205" width="90" height="50" rx="6" class="dev"/>
<text x="345" y="235" text-anchor="middle" class="lbl-w">R0</text>
<rect x="775" y="105" width="80" height="34" rx="4" class="dev"/>
<text x="815" y="127" text-anchor="middle" class="lbl-w">PC1</text>
<text x="802" y="150" text-anchor="end" class="ip">192.168.2.10/24</text>
<text x="802" y="166" text-anchor="end" class="ip">GW 192.168.2.1</text>
<rect x="775" y="215" width="80" height="30" rx="4" fill="#5B6B78"/>
<text x="815" y="235" text-anchor="middle" class="lbl-w">SW1</text>
<rect x="510" y="205" width="90" height="50" rx="6" class="dev"/>
<text x="555" y="235" text-anchor="middle" class="lbl-w">R1</text>
<text x="92" y="200" class="pt">Fa0/1</text>
<text x="808" y="200" text-anchor="end" class="pt">Fa0/1</text>
<text x="130" y="222" class="pt">Fa0/24</text>
<text x="296" y="222" text-anchor="end" class="pt">Gig0/0</text>
<text x="296" y="248" text-anchor="end" class="ip">192.168.1.1/24</text>
<text x="394" y="222" class="pt">Gig0/1</text>
<text x="394" y="248" class="ip">10.0.0.1/30</text>
<text x="450" y="190" text-anchor="middle" class="lbl" style="font-weight:700;fill:#E8792A;">WAN 10.0.0.0/30</text>
<text x="506" y="222" text-anchor="end" class="pt">Gig0/1</text>
<text x="506" y="268" text-anchor="end" class="ip">10.0.0.2/30</text>
<text x="604" y="222" class="pt">Gig0/0</text>
<text x="604" y="248" class="ip">192.168.2.1/24</text>
<text x="770" y="222" text-anchor="end" class="pt">Fa0/24</text>
<line x1="345" y1="255" x2="345" y2="400" class="lk" style="stroke:#E8792A;stroke-width:3;stroke-dasharray:7 5;"/>
<text x="357" y="290" class="pt">R0 Gig0/2 = 203.0.113.1/30</text>
<text x="357" y="388" class="pt">R2 Gig0/0 = 203.0.113.2/30</text>
<rect x="300" y="400" width="90" height="50" rx="6" fill="#ffffff" stroke="#0C3274" stroke-width="2" stroke-dasharray="6 4"/>
<text x="345" y="430" text-anchor="middle" class="lbl" style="font-weight:700;fill:#0C3274;">R2 (ISP)</text>
<text x="410" y="430" class="lbl-sm" style="font-style:italic;">Part C only. Loopback0 = 198.51.100.50/32 stands in for an internet host.</text>
<text x="24" y="490" class="lbl-sm" style="font-style:italic;">*Schematic layout - not a live screenshot. Dashed = added in Part C. Router to router links use Copper Cross-Over.</text>
</svg>
