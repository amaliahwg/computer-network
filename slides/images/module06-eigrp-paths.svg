<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="eigrp-title">
<title id="eigrp-title">Diagram of an EIGRP successor and feasible successor path to the same destination</title>
<style>
  .lbl { font-family: system-ui, -apple-system, sans-serif; fill: #1A1A1A; font-size: 13px; }
  .lbl-sm { font-family: system-ui, -apple-system, sans-serif; fill: #5B6B78; font-size: 12px; }
  .lbl-w { font-family: system-ui, -apple-system, sans-serif; fill: #ffffff; font-size: 13px; font-weight: 700; }
  .lbl-title { font-family: system-ui, -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 600; }
  .dev { fill: #0C3274; }
  .devg { fill: #B7C2CB; }
</style>

<rect x="4" y="4" width="892" height="452" rx="10" fill="#ffffff" stroke="#0C3274" stroke-width="2"/>
<rect x="4" y="4" width="892" height="32" rx="10" fill="#0C3274"/>
<rect x="4" y="20" width="892" height="16" fill="#0C3274"/>
<text x="20" y="25" class="lbl-title">Successor vs. feasible successor - why EIGRP fails over instantly</text>

<!-- R-src -->
<rect x="40" y="204" width="90" height="52" rx="6" class="dev"/>
<text x="85" y="235" text-anchor="middle" class="lbl-w">R-src</text>

<!-- Dest -->
<rect x="770" y="204" width="100" height="52" rx="6" fill="#00A79E"/>
<text x="820" y="235" text-anchor="middle" class="lbl-w">Dest network</text>

<!-- Successor path (top) -->
<rect x="400" y="80" width="100" height="50" rx="6" class="dev"/>
<text x="450" y="110" text-anchor="middle" class="lbl-w">R-A</text>
<line x1="130" y1="220" x2="400" y2="110" stroke="#145DA0" stroke-width="4"/>
<line x1="500" y1="110" x2="770" y2="220" stroke="#145DA0" stroke-width="4"/>
<text x="450" y="65" text-anchor="middle" class="lbl" style="font-weight:700;fill:#145DA0;">Successor - installed route, metric 30</text>
<text x="450" y="150" text-anchor="middle" class="lbl-sm">Currently forwarding all traffic to Dest</text>

<!-- Feasible successor path (bottom) -->
<rect x="400" y="330" width="100" height="50" rx="6" class="devg"/>
<text x="450" y="360" text-anchor="middle" class="lbl" style="fill:#3A4650;font-weight:700;">R-B</text>
<line x1="130" y1="240" x2="400" y2="350" stroke="#B7C2CB" stroke-width="4" stroke-dasharray="8 5"/>
<line x1="500" y1="350" x2="770" y2="240" stroke="#B7C2CB" stroke-width="4" stroke-dasharray="8 5"/>
<text x="450" y="405" text-anchor="middle" class="lbl" style="font-weight:700;fill:#5B6B78;">Feasible successor - backup, metric 45</text>
<text x="450" y="422" text-anchor="middle" class="lbl-sm">Not installed, but already computed and loop-free</text>

<!-- feasibility condition callout -->
<rect x="185" y="180" width="220" height="54" rx="6" fill="#FFF8F1" stroke="#E8792A" stroke-width="2"/>
<text x="295" y="202" text-anchor="middle" class="lbl-sm" style="font-weight:700;fill:#0C3274;">Feasibility condition</text>
<text x="295" y="218" text-anchor="middle" class="lbl-sm">R-B's own distance to Dest (20)</text>
<text x="295" y="231" text-anchor="middle" class="lbl-sm">&lt; R-src's successor metric (30)</text>

<rect x="520" y="180" width="230" height="54" rx="6" fill="#F2F2F2" stroke="#0C3274" stroke-width="1.5"/>
<text x="635" y="200" text-anchor="middle" class="lbl-sm" style="font-weight:700;fill:#0C3274;">On R-A's failure</text>
<text x="635" y="216" text-anchor="middle" class="lbl-sm">R-src switches to R-B instantly -</text>
<text x="635" y="229" text-anchor="middle" class="lbl-sm">no query, no 30 s wait like RIP</text>

<text x="24" y="440" class="lbl-sm" style="font-style:italic;">Schematic - metric values are illustrative, not real EIGRP composite metrics.</text>
</svg>
