<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tr-title">
<title id="tr-title">Diagram of traceroute: each probe's TTL expires one hop further, revealing the path one router at a time</title>
<style>
  .lbl { font-family: system-ui, -apple-system, sans-serif; fill: #1A1A1A; font-size: 13px; }
  .lbl-sm { font-family: system-ui, -apple-system, sans-serif; fill: #5B6B78; font-size: 12px; }
  .lbl-w { font-family: system-ui, -apple-system, sans-serif; fill: #ffffff; font-size: 11px; font-weight: 600; }
  .lbl-title { font-family: system-ui, -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 600; }
  .dev { fill: #0C3274; }
  .devg { fill: #B7C2CB; }
</style>

<rect x="4" y="4" width="892" height="472" rx="10" fill="#ffffff" stroke="#0C3274" stroke-width="2"/>
<rect x="4" y="4" width="892" height="32" rx="10" fill="#0C3274"/>
<rect x="4" y="20" width="892" height="16" fill="#0C3274"/>
<text x="20" y="25" class="lbl-title">Traceroute — one extra TTL per probe reveals one more hop</text>

<!-- device chain -->
<rect x="50" y="70" width="60" height="34" rx="4" class="dev"/>
<text x="80" y="122" text-anchor="middle" class="lbl-sm" style="font-weight:600;">Source</text>
<rect x="235" y="70" width="60" height="34" rx="4" class="devg"/>
<text x="265" y="92" text-anchor="middle" class="lbl-w">R1</text>
<text x="265" y="122" text-anchor="middle" class="lbl-sm">hop 1</text>
<rect x="420" y="70" width="60" height="34" rx="4" class="devg"/>
<text x="450" y="92" text-anchor="middle" class="lbl-w">R2</text>
<text x="450" y="122" text-anchor="middle" class="lbl-sm">hop 2</text>
<rect x="605" y="70" width="60" height="34" rx="4" class="devg"/>
<text x="635" y="92" text-anchor="middle" class="lbl-w">R3</text>
<text x="635" y="122" text-anchor="middle" class="lbl-sm">hop 3</text>
<rect x="790" y="70" width="60" height="34" rx="4" class="dev"/>
<text x="820" y="92" text-anchor="middle" class="lbl-w">Dest</text>
<text x="820" y="122" text-anchor="middle" class="lbl-sm" style="font-weight:600;">hop 4</text>

<line x1="110" y1="87" x2="235" y2="87" stroke="#D7E1E8" stroke-width="2"/>
<line x1="295" y1="87" x2="420" y2="87" stroke="#D7E1E8" stroke-width="2"/>
<line x1="480" y1="87" x2="605" y2="87" stroke="#D7E1E8" stroke-width="2"/>
<line x1="665" y1="87" x2="790" y2="87" stroke="#D7E1E8" stroke-width="2"/>

<!-- Row 1: TTL=1, dies at R1 -->
<text x="24" y="152" class="lbl" style="font-weight:700;fill:#E8792A;">TTL = 1</text>
<rect x="80" y="160" width="185" height="9" rx="4" fill="#E8792A"/>
<polygon points="265,164.5 257,159 257,170" fill="#E8792A"/>
<text x="300" y="167" class="lbl-sm">Probe reaches R1, TTL hits 0 — R1 drops it and replies "ICMP Time Exceeded"</text>

<!-- Row 2: TTL=2, dies at R2 -->
<text x="24" y="208" class="lbl" style="font-weight:700;fill:#E8792A;">TTL = 2</text>
<rect x="80" y="216" width="370" height="9" rx="4" fill="#E8792A"/>
<polygon points="450,220.5 442,215 442,226" fill="#E8792A"/>
<text x="485" y="223" text-anchor="middle" class="lbl-sm">Probe reaches R2, TTL hits 0 — R2 replies "ICMP Time Exceeded"</text>

<!-- Row 3: TTL=3, dies at R3 -->
<text x="24" y="264" class="lbl" style="font-weight:700;fill:#E8792A;">TTL = 3</text>
<rect x="80" y="272" width="555" height="9" rx="4" fill="#E8792A"/>
<polygon points="635,276.5 627,271 627,282" fill="#E8792A"/>
<text x="24" y="298" class="lbl-sm">Probe reaches R3, TTL hits 0 — R3 replies "ICMP Time Exceeded"</text>

<!-- Row 4: TTL=4, reaches destination -->
<text x="24" y="336" class="lbl" style="font-weight:700;fill:#00A79E;">TTL = 4</text>
<rect x="80" y="344" width="740" height="9" rx="4" fill="#00A79E"/>
<polygon points="820,348.5 812,343 812,354" fill="#00A79E"/>
<text x="24" y="372" class="lbl-sm">Probe finally reaches the destination — it replies directly, not "Time Exceeded". Traceroute stops here.</text>

<rect x="24" y="396" width="852" height="46" rx="6" fill="#F6F8FA" stroke="#D7E1E8"/>
<text x="40" y="414" class="lbl-sm" style="font-weight:600;">Each reply's source address names the router that just ran out of TTL —</text>
<text x="40" y="432" class="lbl-sm">that is how traceroute builds the hop-by-hop path without any router cooperating on purpose.</text>

<text x="24" y="464" class="lbl-sm" style="font-style:italic;">Schematic — bar lengths are illustrative, not proportional to real latency.</text>
</svg>
