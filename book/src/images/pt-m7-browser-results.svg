<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m7b-t">
<title id="m7b-t">Schematic comparing the web browser loading the server page with a blocked request that times out</title>
<style>
  .lbl { font-family: system-ui, -apple-system, sans-serif; fill: #1A1A1A; font-size: 13px; }
  .lbl-sm { font-family: system-ui, -apple-system, sans-serif; fill: #5B6B78; font-size: 12px; }
  .lbl-w { font-family: system-ui, -apple-system, sans-serif; fill: #ffffff; font-size: 12px; font-weight: 600; }
  .lbl-title { font-family: system-ui, -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 600; }
  .term { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 12.5px; fill: #F6F8FA; }
  .term-hi { fill: #00A79E; font-weight: 600; }
  .term-bad { fill: #FFB4B4; font-weight: 600; }
  .term-key { fill: #F2A900; font-weight: 600; }
  .mono { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 12.5px; fill: #0C3274; font-weight: 600; }
  .dev { fill: #0C3274; }
</style>
<rect x="4" y="4" width="892" height="412" rx="10" fill="#ffffff" stroke="#0C3274" stroke-width="2"/>
<rect x="4" y="4" width="892" height="32" rx="10" fill="#0C3274"/>
<rect x="4" y="20" width="892" height="16" fill="#0C3274"/>
<text x="20" y="25" class="lbl-title">Desktop &gt; Web Browser on PC-User or PC-Admin</text>
<rect x="16" y="48" width="426" height="24" rx="4" fill="#00A79E"/>
<text x="28" y="65" class="lbl-w">HTTP allowed (PC-Admin, or PC-User before the ACL)</text>
<rect x="16" y="76" width="426" height="250" rx="6" fill="#ffffff" stroke="#D7E1E8" stroke-width="1.5"/>
<rect x="26" y="86" width="406" height="26" rx="4" fill="#F6F8FA" stroke="#D7E1E8"/>
<text x="36" y="104" class="mono">http://192.168.2.100</text>
<rect x="372" y="90" width="50" height="18" rx="3" fill="#0C3274"/><text x="397" y="103" text-anchor="middle" class="lbl-w" style="font-size:11px;">Go</text>
<text x="40" y="160" class="lbl" style="font-size:20px;font-weight:700;fill:#0C3274;">Cisco Packet Tracer</text>
<text x="40" y="188" class="lbl">Welcome to Cisco Packet Tracer. Opening doors to</text>
<text x="40" y="206" class="lbl">new opportunities. Mind Wide Open.</text>
<text x="40" y="250" class="lbl-sm">(the Server's default home page: the page loaded)</text>
<rect x="458" y="48" width="426" height="24" rx="4" fill="#C0392B"/>
<text x="470" y="65" class="lbl-w">HTTP denied (PC-User with the ACL applied)</text>
<rect x="458" y="76" width="426" height="250" rx="6" fill="#ffffff" stroke="#D7E1E8" stroke-width="1.5"/>
<rect x="468" y="86" width="406" height="26" rx="4" fill="#F6F8FA" stroke="#D7E1E8"/>
<text x="478" y="104" class="mono">http://192.168.2.100</text>
<rect x="814" y="90" width="50" height="18" rx="3" fill="#0C3274"/><text x="839" y="103" text-anchor="middle" class="lbl-w" style="font-size:11px;">Go</text>
<text x="482" y="170" class="lbl" style="font-size:20px;font-weight:700;fill:#C0392B;">Request Timeout</text>
<text x="482" y="200" class="lbl">The browser got no answer from the Server.</text>
<text x="482" y="250" class="lbl-sm">(the ACL dropped the request: PC-User after Step 8)</text>
<text x="30" y="352" class="lbl-sm">Same URL, same Server, same cable: only the ACL changed. If the page loads for PC-User after Part B, the ACL is on the wrong router,</text>
<text x="30" y="370" class="lbl-sm">interface, or direction, or its first rule does not match; check with show ip interface and show access-lists.</text>
<text x="24" y="406" class="lbl-sm" style="font-style:italic;">Schematic layout - not a live screenshot; the page text and wording of the timeout message may differ in your Packet Tracer version.</text>
</svg>
