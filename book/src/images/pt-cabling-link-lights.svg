<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pt-cabling-title">
<title id="pt-cabling-title">Schematic diagram of Packet Tracer link-light states and cable type reference</title>
<style>
  .lbl { font-family: system-ui, -apple-system, sans-serif; fill: #1A1A1A; }
  .lbl-sm { font-family: system-ui, -apple-system, sans-serif; fill: #5B6B78; font-size: 12px; }
  .lbl-title { font-family: system-ui, -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 600; }
  .panel { fill: #ffffff; stroke: #D7E1E8; stroke-width: 1.5; }
  .state-ok { fill: #00A79E; }
  .state-warn { fill: #F2A900; }
  .state-bad { fill: #D64545; }
</style>

<!-- window frame -->
<rect x="4" y="4" width="892" height="452" rx="10" fill="#ffffff" stroke="#0C3274" stroke-width="2"/>

<!-- title bar -->
<rect x="4" y="4" width="892" height="32" rx="10" fill="#0C3274"/>
<rect x="4" y="20" width="892" height="16" fill="#0C3274"/>
<text x="20" y="25" class="lbl-title">Link Lights and Cable Types</text>
<circle cx="850" cy="20" r="5" fill="#00A79E"/>
<circle cx="868" cy="20" r="5" fill="#E3F3F1"/>

<!-- three link-light state cards -->
<rect x="16" y="48" width="280" height="150" rx="6" class="panel"/>
<rect x="44" y="70" width="44" height="30" rx="3" fill="#0C3274"/>
<circle cx="98" cy="70" r="7" class="state-ok"/>
<text x="44" y="120" class="lbl" style="font-size:13px;font-weight:600;">UP / UP (green)</text>
<text x="44" y="140" class="lbl-sm">Solid green - Layer 1 (cable/</text>
<text x="44" y="154" class="lbl-sm">signal) and Layer 2 (protocol)</text>
<text x="44" y="168" class="lbl-sm">are both up. Ready to forward.</text>

<rect x="310" y="48" width="280" height="150" rx="6" class="panel"/>
<rect x="338" y="70" width="44" height="30" rx="3" fill="#0C3274"/>
<circle cx="392" cy="70" r="7" class="state-warn"/>
<text x="338" y="120" class="lbl" style="font-size:13px;font-weight:600;">NEGOTIATING (amber)</text>
<text x="338" y="140" class="lbl-sm">Blinking amber - auto-negotiating</text>
<text x="338" y="154" class="lbl-sm">speed/duplex, or STP is in</text>
<text x="338" y="168" class="lbl-sm">Listening/Learning. Wait a moment.</text>

<rect x="604" y="48" width="280" height="150" rx="6" class="panel"/>
<rect x="632" y="70" width="44" height="30" rx="3" fill="#0C3274"/>
<circle cx="686" cy="70" r="7" class="state-bad"/>
<text x="632" y="120" class="lbl" style="font-size:13px;font-weight:600;">DOWN (red)</text>
<text x="632" y="140" class="lbl-sm">Solid red - no cable, wrong cable</text>
<text x="632" y="154" class="lbl-sm">type, interface shutdown, or the</text>
<text x="632" y="168" class="lbl-sm">far end is off/misconfigured.</text>

<!-- cable type legend -->
<rect x="16" y="212" width="868" height="228" rx="6" class="panel"/>
<text x="32" y="236" class="lbl" style="font-size:13px;font-weight:600;">CABLE TYPES</text>

<line x1="32" y1="256" x2="72" y2="256" stroke="#0C3274" stroke-width="3"/>
<text x="84" y="260" class="lbl-sm" style="font-weight:600;fill:#1A1A1A;">Straight-Through</text>
<text x="240" y="260" class="lbl-sm">PC/Server to Switch, Switch to Router - unlike devices</text>

<line x1="32" y1="292" x2="52" y2="292" stroke="#00A79E" stroke-width="3"/>
<line x1="52" y1="292" x2="72" y2="282" stroke="#00A79E" stroke-width="3"/>
<text x="84" y="296" class="lbl-sm" style="font-weight:600;fill:#1A1A1A;">Crossover</text>
<text x="240" y="296" class="lbl-sm">PC to PC, Router to Router (Ethernet), old Switch to Switch</text>

<line x1="32" y1="328" x2="72" y2="328" stroke="#7EA8FF" stroke-width="3" stroke-dasharray="2 2"/>
<text x="84" y="332" class="lbl-sm" style="font-weight:600;fill:#1A1A1A;">Console (Rollover)</text>
<text x="240" y="332" class="lbl-sm">PC COM/USB to Router or Switch console port - management only</text>

<line x1="32" y1="364" x2="72" y2="364" stroke="#5B6B78" stroke-width="3"/>
<circle cx="72" cy="364" r="4" fill="#5B6B78"/>
<text x="84" y="368" class="lbl-sm" style="font-weight:600;fill:#1A1A1A;">Serial DCE/DTE</text>
<text x="240" y="368" class="lbl-sm">Router to Router WAN link - the DCE end sets the clock rate</text>

<text x="32" y="404" class="lbl-sm">Tip: use the <tspan style="font-weight:600;">Automatic</tspan> cable (lightning bolt icon) if unsure - PT chooses the correct type.</text>
<text x="32" y="422" class="lbl-sm">For learning, choose manually first so the pattern becomes automatic.</text>

<text x="16" y="446" class="lbl-sm" style="font-style:italic;">*Schematic layout - not a live screenshot. Exact light colors/blink timing match your installed PT version closely.</text>
</svg>
