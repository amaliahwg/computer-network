<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pt-ladder-title">
<title id="pt-ladder-title">Schematic diagram of a Packet Tracer CLI session moving through the IOS mode hierarchy, with a ladder of all five prompt states</title>
<style>
  .lbl { font-family: system-ui, -apple-system, sans-serif; fill: #1A1A1A; }
  .lbl-sm { font-family: system-ui, -apple-system, sans-serif; fill: #5B6B78; font-size: 12px; }
  .lbl-title { font-family: system-ui, -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 600; }
  .panel { fill: #ffffff; stroke: #D7E1E8; stroke-width: 1.5; }
  .term { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 12.5px; fill: #F6F8FA; }
  .term-hi { fill: #00A79E; font-weight: 600; }
  .mono { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 12.5px; fill: #0C3274; font-weight: 600; }
</style>

<rect x="4" y="4" width="892" height="472" rx="10" fill="#ffffff" stroke="#0C3274" stroke-width="2"/>
<rect x="4" y="4" width="892" height="32" rx="10" fill="#0C3274"/>
<rect x="4" y="20" width="892" height="16" fill="#0C3274"/>
<text x="20" y="25" class="lbl-title">Router - CLI</text>

<!-- terminal panel: Module 3's own Step 3 sequence -->
<rect x="16" y="44" width="864" height="134" rx="6" fill="#0C3274" stroke="#00A79E" stroke-width="1.5"/>
<text x="30" y="66" class="term"><tspan class="term-hi">Router&gt;</tspan> enable</text>
<text x="30" y="84" class="term"><tspan class="term-hi">Router#</tspan> configure terminal</text>
<text x="30" y="102" class="term"><tspan class="term-hi">Router(config)#</tspan> interface FastEthernet 0/0</text>
<text x="30" y="120" class="term"><tspan class="term-hi">Router(config-if)#</tspan> exit</text>
<text x="30" y="138" class="term"><tspan class="term-hi">Router(config)#</tspan> end</text>
<text x="30" y="156" class="term"><tspan class="term-hi">Router#</tspan></text>

<!-- prompt-mode ladder: all five states used across Module 3 -->
<rect x="16" y="192" width="864" height="178" rx="6" class="panel"/>
<text x="30" y="214" class="lbl" style="font-size:13px;font-weight:600;">IOS PROMPT-MODE LADDER</text>

<rect x="30" y="226" width="4" height="18" fill="#00A79E"/>
<text x="46" y="240" class="mono">Router&gt;</text>
<text x="180" y="240" class="lbl-sm">User EXEC - view-only, limited commands</text>

<rect x="30" y="252" width="4" height="18" fill="#00A79E"/>
<text x="46" y="266" class="mono">Router#</text>
<text x="180" y="266" class="lbl-sm">Privileged EXEC - full show/debug access, no config changes yet</text>

<rect x="30" y="278" width="4" height="18" fill="#00A79E"/>
<text x="46" y="292" class="mono">Router(config)#</text>
<text x="260" y="292" class="lbl-sm">Global Configuration - system-wide settings (hostname, passwords)</text>

<rect x="30" y="304" width="4" height="18" fill="#00A79E"/>
<text x="46" y="318" class="mono">Router(config-if)#</text>
<text x="280" y="318" class="lbl-sm">Interface Configuration - one interface's IP / shutdown state (Module 4)</text>

<rect x="30" y="330" width="4" height="18" fill="#00A79E"/>
<text x="46" y="344" class="mono">Router(config-line)#</text>
<text x="290" y="344" class="lbl-sm">Line Configuration - console / VTY passwords (Part C of this module)</text>

<text x="16" y="394" class="lbl-sm" style="font-style:italic;">*Schematic layout - not a live screenshot. This module reaches Global, Interface, and Line Config; Router Config (routing protocols) comes later.</text>
</svg>
