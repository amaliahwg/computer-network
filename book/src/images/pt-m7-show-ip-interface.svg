<svg viewBox="0 0 900 390" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m7i-t">
<title id="m7i-t">Schematic of show ip interface GigabitEthernet0/0 highlighting the Inbound access list line</title>
<style>
  .lbl { font-family: system-ui, -apple-system, sans-serif; fill: #1A1A1A; font-size: 13px; }
  .lbl-sm { font-family: system-ui, -apple-system, sans-serif; fill: #5B6B78; font-size: 12px; }
  .lbl-w { font-family: system-ui, -apple-system, sans-serif; fill: #ffffff; font-size: 12px; font-weight: 600; }
  .lbl-title { font-family: system-ui, -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 600; }
  .term { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 12.5px; fill: #F6F8FA; }
  .term-hi { fill: #00A79E; font-weight: 600; }
  .term-bad { fill: #FFB4B4; font-weight: 600; }
  .term-key { fill: #F2A900; font-weight: 600; }
  .mono { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 12.5px; fill: #0C3274; font-weight: 600; }
  .dev { fill: #0C3274; }
</style>
<rect x="4" y="4" width="892" height="382" rx="10" fill="#ffffff" stroke="#0C3274" stroke-width="2"/>
<rect x="4" y="4" width="892" height="32" rx="10" fill="#0C3274"/>
<rect x="4" y="20" width="892" height="16" fill="#0C3274"/>
<text x="20" y="25" class="lbl-title">R0 - CLI</text>
<rect x="16" y="48" width="868" height="240" rx="6" fill="#0C3274" stroke="#00A79E" stroke-width="1.5"/>
<text x="30" y="70" class="term" xml:space="preserve"><tspan class="term-hi">R0#</tspan> show ip interface GigabitEthernet0/0</text>
<text x="30" y="90" class="term" xml:space="preserve">GigabitEthernet0/0 is up, line protocol is up (connected)</text>
<text x="30" y="110" class="term" xml:space="preserve">  Internet address is 192.168.1.1/24</text>
<text x="30" y="130" class="term" xml:space="preserve">  Broadcast address is 255.255.255.255</text>
<text x="30" y="150" class="term" xml:space="preserve">  MTU is 1500 bytes</text>
<text x="30" y="170" class="term" xml:space="preserve">  Helper address is not set</text>
<text x="30" y="190" class="term" xml:space="preserve">  Directed broadcast forwarding is disabled</text>
<text x="30" y="210" class="term" xml:space="preserve">  Outgoing access list is not set</text>
<rect x="22" y="216" width="856" height="20" rx="3" fill="#00A79E" opacity="0.35"/>
<text x="30" y="230" class="term term-key" xml:space="preserve">  Inbound  access list is BLOCK_WEB</text>
<text x="30" y="250" class="term" xml:space="preserve">  Proxy ARP is enabled</text>
<text x="30" y="270" class="term" xml:space="preserve">  ...</text>
<text x="30" y="316" class="lbl" style="font-weight:600;">Only the two access-list lines matter here: they show the ACL name or number bound in each direction.</text>
<text x="30" y="338" class="lbl-sm">"not set" means nothing is bound in that direction. If the highlighted line says "not set", the ACL exists but filters nothing.</text>
<text x="24" y="376" class="lbl-sm" style="font-style:italic;">Schematic layout - not a live screenshot; the lines between the ones shown are abbreviated.</text>
</svg>
