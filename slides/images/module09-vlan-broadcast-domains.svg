<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vlan-bd-title">
<title id="vlan-bd-title">Diagram of one physical switch split into two isolated VLAN broadcast domains</title>
<style>
  .lbl { font-family: system-ui, -apple-system, sans-serif; fill: #1A1A1A; font-size: 13px; }
  .lbl-sm { font-family: system-ui, -apple-system, sans-serif; fill: #5B6B78; font-size: 12px; }
  .lbl-w { font-family: system-ui, -apple-system, sans-serif; fill: #ffffff; font-size: 13px; font-weight: 600; }
  .lbl-title { font-family: system-ui, -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 600; }
</style>

<rect x="4" y="4" width="892" height="472" rx="10" fill="#ffffff" stroke="#0C3274" stroke-width="2"/>
<rect x="4" y="4" width="892" height="32" rx="10" fill="#0C3274"/>
<rect x="4" y="20" width="892" height="16" fill="#0C3274"/>
<text x="20" y="25" class="lbl-title">One physical switch, two isolated broadcast domains</text>

<!-- VLAN 10 domain box -->
<rect x="40" y="50" width="380" height="300" rx="14" fill="#145DA0" fill-opacity="0.08" stroke="#145DA0" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="56" y="64" width="104" height="28" rx="14" fill="#145DA0"/>
<text x="108" y="83" text-anchor="middle" class="lbl-w">VLAN 10</text>
<text x="60" y="330" class="lbl-sm">Broadcasts from PC-A or PC-B reach only</text>
<text x="60" y="346" class="lbl-sm">other VLAN 10 ports — never VLAN 20.</text>

<!-- VLAN 20 domain box -->
<rect x="480" y="50" width="380" height="300" rx="14" fill="#E8792A" fill-opacity="0.10" stroke="#E8792A" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="496" y="64" width="104" height="28" rx="14" fill="#E8792A"/>
<text x="548" y="83" text-anchor="middle" class="lbl-w">VLAN 20</text>
<text x="500" y="330" class="lbl-sm">Broadcasts from PC-C or PC-D reach only</text>
<text x="500" y="346" class="lbl-sm">other VLAN 20 ports — never VLAN 10.</text>

<!-- PCs VLAN10 -->
<rect x="100" y="150" width="42" height="30" rx="4" fill="#145DA0"/>
<text x="121" y="196" text-anchor="middle" class="lbl-sm">PC-A</text>
<rect x="300" y="150" width="42" height="30" rx="4" fill="#145DA0"/>
<text x="321" y="196" text-anchor="middle" class="lbl-sm">PC-B</text>

<!-- PCs VLAN20 -->
<rect x="540" y="150" width="42" height="30" rx="4" fill="#E8792A"/>
<text x="561" y="196" text-anchor="middle" class="lbl-sm">PC-C</text>
<rect x="740" y="150" width="42" height="30" rx="4" fill="#E8792A"/>
<text x="761" y="196" text-anchor="middle" class="lbl-sm">PC-D</text>

<!-- lines from PCs down to switch ports -->
<line x1="121" y1="180" x2="121" y2="390" stroke="#145DA0" stroke-width="2"/>
<line x1="321" y1="180" x2="321" y2="390" stroke="#145DA0" stroke-width="2"/>
<line x1="561" y1="180" x2="561" y2="390" stroke="#E8792A" stroke-width="2"/>
<line x1="761" y1="180" x2="761" y2="390" stroke="#E8792A" stroke-width="2"/>

<!-- switch -->
<rect x="40" y="390" width="820" height="50" rx="8" fill="#0C3274"/>
<text x="450" y="412" text-anchor="middle" class="lbl-w">SW0 — one physical switch</text>
<text x="450" y="430" text-anchor="middle" class="lbl-sm" style="fill:#D7E1E8;">Ports 1–2 in VLAN 10, ports 3–4 in VLAN 20 — same hardware, two logical networks</text>

<!-- port markers -->
<rect x="112" y="384" width="18" height="10" fill="#145DA0"/>
<rect x="312" y="384" width="18" height="10" fill="#145DA0"/>
<rect x="552" y="384" width="18" height="10" fill="#E8792A"/>
<rect x="752" y="384" width="18" height="10" fill="#E8792A"/>

<text x="24" y="464" class="lbl-sm" style="font-style:italic;">Schematic — a PC in VLAN 10 cannot directly reach a PC in VLAN 20, even on this same switch.</text>
</svg>
