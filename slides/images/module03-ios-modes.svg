<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="iosmodes-title">
<title id="iosmodes-title">State diagram of the IOS mode hierarchy: User EXEC, Privileged EXEC, Global Config, Interface Config, and the commands that move between them</title>
<style>
  .lbl { font-family: system-ui, -apple-system, sans-serif; fill: #1A1A1A; font-size: 15px; font-weight: 700; }
  .lbl-sm { font-family: system-ui, -apple-system, sans-serif; fill: #5B6B78; font-size: 12px; }
  .lbl-a { font-family: system-ui, -apple-system, sans-serif; fill: #145DA0; font-size: 13px; font-weight: 700; }
  .lbl-b { font-family: system-ui, -apple-system, sans-serif; fill: #E8792A; font-size: 13px; font-weight: 700; }
  .lbl-title { font-family: system-ui, -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 600; }
  .prompt { font-family: 'Courier New', monospace; fill: #0C3274; font-size: 14px; font-weight: 700; }
  .box { fill: #E3F3F1; stroke: #00A79E; stroke-width: 1.5; }
</style>

<rect x="4" y="4" width="892" height="472" rx="10" fill="#ffffff" stroke="#0C3274" stroke-width="2"/>
<rect x="4" y="4" width="892" height="32" rx="10" fill="#0C3274"/>
<rect x="4" y="20" width="892" height="16" fill="#0C3274"/>
<text x="20" y="25" class="lbl-title">IOS mode hierarchy - the prompt tells you exactly where you are</text>

<!-- Boxes -->
<rect x="20" y="190" width="170" height="100" rx="8" class="box"/>
<text x="105" y="215" text-anchor="middle" class="lbl">User EXEC</text>
<rect x="35" y="230" width="140" height="34" rx="5" fill="#ffffff" stroke="#D7E1E8"/>
<text x="105" y="252" text-anchor="middle" class="prompt">Router&gt;</text>

<rect x="250" y="190" width="170" height="100" rx="8" class="box"/>
<text x="335" y="215" text-anchor="middle" class="lbl">Privileged EXEC</text>
<rect x="265" y="230" width="140" height="34" rx="5" fill="#ffffff" stroke="#D7E1E8"/>
<text x="335" y="252" text-anchor="middle" class="prompt">Router#</text>

<rect x="480" y="190" width="170" height="100" rx="8" class="box"/>
<text x="565" y="215" text-anchor="middle" class="lbl">Global Config</text>
<rect x="490" y="230" width="150" height="34" rx="5" fill="#ffffff" stroke="#D7E1E8"/>
<text x="565" y="252" text-anchor="middle" class="prompt" style="font-size:13px;">Router(config)#</text>

<rect x="710" y="190" width="170" height="100" rx="8" class="box"/>
<text x="795" y="208" text-anchor="middle" class="lbl" style="font-size:13px;">Interface /</text>
<text x="795" y="224" text-anchor="middle" class="lbl" style="font-size:13px;">Line Config</text>
<rect x="716" y="232" width="158" height="48" rx="5" fill="#ffffff" stroke="#D7E1E8"/>
<text x="795" y="250" text-anchor="middle" class="prompt" style="font-size:10.5px;">Router(config-if)#</text>
<text x="795" y="268" text-anchor="middle" class="prompt" style="font-size:10.5px;">Router(config-line)#</text>

<!-- Forward transitions (top arcs) -->
<path d="M190,240 Q220,150 250,240" fill="none" stroke="#145DA0" stroke-width="2.5"/>
<polygon points="250,240 242,235 242,245" fill="#145DA0"/>
<text x="220" y="140" text-anchor="middle" class="lbl-a">enable</text>

<path d="M420,240 Q450,150 480,240" fill="none" stroke="#145DA0" stroke-width="2.5"/>
<polygon points="480,240 472,235 472,245" fill="#145DA0"/>
<text x="450" y="140" text-anchor="middle" class="lbl-a">configure terminal</text>

<path d="M650,240 Q680,150 710,240" fill="none" stroke="#145DA0" stroke-width="2.5"/>
<polygon points="710,240 702,235 702,245" fill="#145DA0"/>
<text x="680" y="132" text-anchor="middle" class="lbl-a">interface Fa0/0</text>
<text x="680" y="148" text-anchor="middle" class="lbl-a">line console 0 / vty 0 4</text>

<!-- Backward transitions (bottom arcs) -->
<path d="M710,290 Q680,350 650,290" fill="none" stroke="#E8792A" stroke-width="2.5"/>
<polygon points="650,290 658,285 658,295" fill="#E8792A"/>
<text x="680" y="368" text-anchor="middle" class="lbl-b">exit</text>

<path d="M710,300 Q565,430 420,300" fill="none" stroke="#E8792A" stroke-width="2.5"/>
<polygon points="420,300 428,295 428,305" fill="#E8792A"/>
<text x="565" y="440" text-anchor="middle" class="lbl-b">end</text>
<text x="565" y="456" text-anchor="middle" class="lbl-sm">(Ctrl+Z - jumps straight back to Privileged EXEC from any config mode)</text>

<text x="24" y="392" class="lbl-sm" style="font-style:italic;">Schematic - arrows show the commands typed at each prompt, not real network traffic.</text>
</svg>
