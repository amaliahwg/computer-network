<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="acl-flow-title">
<title id="acl-flow-title">Flowchart of ACL processing: each line checked top to bottom, first match wins, implicit deny at the end</title>
<defs>
  <marker id="aclArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0L10,5L0,10z" fill="#5B6B78"/>
  </marker>
</defs>
<style>
  .lbl { font-family: system-ui, -apple-system, sans-serif; fill: #1A1A1A; font-size: 13px; }
  .lbl-sm { font-family: system-ui, -apple-system, sans-serif; fill: #5B6B78; font-size: 12px; }
  .lbl-w { font-family: system-ui, -apple-system, sans-serif; fill: #ffffff; font-size: 13px; font-weight: 600; }
  .lbl-title { font-family: system-ui, -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 600; }
  .diamond { fill: #ffffff; stroke: #145DA0; stroke-width: 2; }
  .noline { stroke: #5B6B78; stroke-width: 2; fill: none; }
</style>

<rect x="4" y="4" width="892" height="512" rx="10" fill="#ffffff" stroke="#0C3274" stroke-width="2"/>
<rect x="4" y="4" width="892" height="32" rx="10" fill="#0C3274"/>
<rect x="4" y="20" width="892" height="16" fill="#0C3274"/>
<text x="20" y="25" class="lbl-title">How the router evaluates an ACL - top to bottom, first match wins</text>

<!-- start -->
<rect x="330" y="50" width="240" height="42" rx="8" fill="#E3F3F1" stroke="#00A79E" stroke-width="2"/>
<text x="450" y="76" text-anchor="middle" class="lbl" style="font-weight:600;">Packet arrives on the ACL'd interface</text>
<line x1="450" y1="92" x2="450" y2="118" class="noline" marker-end="url(#aclArrow)"/>

<!-- diamond 1 -->
<polygon points="450,118 540,158 450,198 360,158" class="diamond"/>
<text x="450" y="152" text-anchor="middle" class="lbl" style="font-weight:600;">Line 1</text>
<text x="450" y="168" text-anchor="middle" class="lbl" style="font-weight:600;">match?</text>
<line x1="540" y1="158" x2="590" y2="158" class="noline" marker-end="url(#aclArrow)"/>
<text x="560" y="148" class="lbl-sm" style="font-weight:700;fill:#00A79E;">yes</text>
<rect x="590" y="133" width="270" height="50" rx="6" fill="#00A79E"/>
<text x="725" y="153" text-anchor="middle" class="lbl-w">Line 1's action applies</text>
<text x="725" y="170" text-anchor="middle" class="lbl-w" style="font-size:11px;">(permit or deny) - processing stops</text>

<line x1="450" y1="198" x2="450" y2="224" class="noline" marker-end="url(#aclArrow)"/>
<text x="465" y="216" class="lbl-sm" style="font-weight:700;">no</text>

<!-- diamond 2 -->
<polygon points="450,224 540,264 450,304 360,264" class="diamond"/>
<text x="450" y="258" text-anchor="middle" class="lbl" style="font-weight:600;">Line 2</text>
<text x="450" y="274" text-anchor="middle" class="lbl" style="font-weight:600;">match?</text>
<line x1="540" y1="264" x2="590" y2="264" class="noline" marker-end="url(#aclArrow)"/>
<text x="560" y="254" class="lbl-sm" style="font-weight:700;fill:#00A79E;">yes</text>
<rect x="590" y="239" width="270" height="50" rx="6" fill="#00A79E"/>
<text x="725" y="259" text-anchor="middle" class="lbl-w">Line 2's action applies</text>
<text x="725" y="276" text-anchor="middle" class="lbl-w" style="font-size:11px;">(permit or deny) - processing stops</text>

<line x1="450" y1="304" x2="450" y2="330" class="noline" marker-end="url(#aclArrow)"/>
<text x="465" y="322" class="lbl-sm" style="font-weight:700;">no</text>

<!-- diamond 3 -->
<polygon points="450,330 540,370 450,410 360,370" class="diamond"/>
<text x="450" y="364" text-anchor="middle" class="lbl" style="font-weight:600;">Line 3</text>
<text x="450" y="380" text-anchor="middle" class="lbl" style="font-weight:600;">match?</text>
<line x1="540" y1="370" x2="590" y2="370" class="noline" marker-end="url(#aclArrow)"/>
<text x="560" y="360" class="lbl-sm" style="font-weight:700;fill:#00A79E;">yes</text>
<rect x="590" y="345" width="270" height="50" rx="6" fill="#00A79E"/>
<text x="725" y="365" text-anchor="middle" class="lbl-w">Line 3's action applies</text>
<text x="725" y="382" text-anchor="middle" class="lbl-w" style="font-size:11px;">(permit or deny) - processing stops</text>

<line x1="450" y1="410" x2="450" y2="436" class="noline" marker-end="url(#aclArrow)"/>
<text x="465" y="428" class="lbl-sm" style="font-weight:700;">no</text>

<!-- implicit deny -->
<rect x="300" y="436" width="300" height="56" rx="8" fill="#0C3274"/>
<text x="450" y="458" text-anchor="middle" class="lbl-w">No line matched</text>
<text x="450" y="478" text-anchor="middle" class="lbl-w">implicit deny all - packet dropped</text>

<text x="24" y="508" class="lbl-sm" style="font-style:italic;">Schematic - three lines shown; a real ACL can have as many lines as needed before the implicit deny.</text>
</svg>
