<svg viewBox="0 0 900 395" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m7a-t">
<title id="m7a-t">Schematic of show access-lists output with match counters per rule</title>
<style>
  .lbl { font-family: system-ui, -apple-system, sans-serif; fill: #1A1A1A; font-size: 13px; }
  .lbl-sm { font-family: system-ui, -apple-system, sans-serif; fill: #5B6B78; font-size: 12px; }
  .lbl-w { font-family: system-ui, -apple-system, sans-serif; fill: #ffffff; font-size: 12px; font-weight: 600; }
  .lbl-title { font-family: system-ui, -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 600; }
  .term { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 12.5px; fill: #F6F8FA; }
  .term-hi { fill: #00A79E; font-weight: 600; }
  .term-bad { fill: #FFB4B4; font-weight: 600; }
  .term-key { fill: #F2A900; font-weight: 600; }
  .mono { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 12.5px; fill: #0C3274; font-weight: 600; }
  .dev { fill: #0C3274; }
</style>
<rect x="4" y="4" width="892" height="387" rx="10" fill="#ffffff" stroke="#0C3274" stroke-width="2"/>
<rect x="4" y="4" width="892" height="32" rx="10" fill="#0C3274"/>
<rect x="4" y="20" width="892" height="16" fill="#0C3274"/>
<text x="20" y="25" class="lbl-title">R0 - CLI</text>
<rect x="16" y="48" width="868" height="130" rx="6" fill="#0C3274" stroke="#00A79E" stroke-width="1.5"/>
<text x="30" y="70" class="term" xml:space="preserve"><tspan class="term-hi">R0#</tspan> show access-lists</text>
<text x="30" y="92" class="term" xml:space="preserve">Extended IP access list BLOCK_WEB</text>
<rect x="22" y="100" width="856" height="22" rx="3" fill="#00A79E" opacity="0.35"/>
<text x="30" y="114" class="term term-key" xml:space="preserve">    10 deny tcp host 192.168.1.20 host 192.168.2.100 eq www (8 match(es))</text>
<text x="30" y="136" class="term" xml:space="preserve">    20 permit ip any any (12 match(es))</text>
<text x="30" y="158" class="term" xml:space="preserve"><tspan class="term-hi">R0#</tspan> </text>
<rect x="16" y="194" width="868" height="150" rx="6" fill="#E3F3F1" stroke="#00A79E" stroke-width="1.5"/>
<text x="30" y="218" class="lbl" style="font-weight:600;">HOW TO READ IT</text>
<text x="30" y="244" class="lbl-sm">Numbers at the left (10, 20) are sequence numbers - use them with "no 20" to delete one rule.</text>
<text x="30" y="266" class="lbl-sm">The highlighted line is the rule that blocked PC-User's web requests; its counter rises on every blocked attempt.</text>
<text x="30" y="288" class="lbl-sm">The counter on a rule counts packets that matched it, so a rule that never matches shows no counter at all.</text>
<text x="30" y="310" class="lbl-sm">Your counts will differ; what matters is which line increases when you send traffic.</text>
<text x="24" y="381" class="lbl-sm" style="font-style:italic;">Schematic layout - not a live screenshot; some Packet Tracer versions print "(8 matches)" instead of "(8 match(es))".</text>
</svg>
