<svg viewBox="0 0 900 448" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-pt-m4-help-output.svg">
<title id="t-pt-m4-help-output.svg">Schematic of context-sensitive help output: the list returned by show ip question mark, and word completion with show ip int question mark</title>
<style>
  .lbl-title { font-family: system-ui, -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 600; }
  .lbl-sm { font-family: system-ui, -apple-system, sans-serif; fill: #5B6B78; font-size: 12px; }
  .note { font-family: system-ui, -apple-system, sans-serif; fill: #E3F3F1; font-size: 12px; font-weight: 700; }
  .term { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 12.5px; fill: #F6F8FA; white-space: pre; }
  .pr { fill: #00D1C4; font-weight: 700; }
  .ok { fill: #7FE3A0; font-weight: 700; }
  .bad { fill: #FFB4A8; font-weight: 700; }
  .hi { fill: #FFD76A; font-weight: 700; }
  .dim { fill: #9FB3D1; }
</style>
<rect x="4" y="4" width="892" height="440" rx="10" fill="#ffffff" stroke="#0C3274" stroke-width="2"/>
<rect x="4" y="4" width="892" height="32" rx="10" fill="#0C3274"/>
<rect x="4" y="20" width="892" height="16" fill="#0C3274"/>
<text x="20" y="25" class="lbl-title">Router# show ip ?  - context-sensitive help output</text>
<circle cx="850" cy="20" r="5" fill="#00A79E"/><circle cx="868" cy="20" r="5" fill="#E3F3F1"/>
<rect x="16" y="44" width="868" height="352" rx="6" fill="#0C3274" stroke="#00A79E" stroke-width="1.5"/>
<text x="30" y="70" class="term" xml:space="preserve"><tspan class="pr">Router#</tspan>show ip ?</text>
<text x="30" y="88" class="term" xml:space="preserve">  access-lists   List access lists</text>
<text x="30" y="106" class="term" xml:space="preserve">  arp            IP ARP table</text>
<text x="30" y="124" class="term" xml:space="preserve">  dhcp           Show items in the DHCP database</text>
<text x="30" y="142" class="term" xml:space="preserve">  interface      IP interface status and configuration</text>
<text x="30" y="160" class="term" xml:space="preserve">  nat            IP NAT information</text>
<text x="30" y="178" class="term" xml:space="preserve">  ospf           OSPF information</text>
<text x="30" y="196" class="term" xml:space="preserve">  protocols      Active IP routing protocols</text>
<text x="30" y="214" class="term" xml:space="preserve">  rip            IP RIP show commands</text>
<text x="30" y="232" class="term" xml:space="preserve">  route          IP routing table</text>
<text x="30" y="250" class="term" xml:space="preserve">  ssh            Information on SSH</text>
<text x="30" y="268" class="term" xml:space="preserve"><tspan class="dim">  --More--</tspan></text>
<text x="30" y="286" class="term" xml:space="preserve"></text>
<text x="30" y="304" class="term" xml:space="preserve"><tspan class="pr">Router#</tspan>show ip int?</text>
<text x="30" y="322" class="term" xml:space="preserve">interface</text>
<text x="30" y="340" class="term" xml:space="preserve"></text>
<text x="30" y="358" class="term" xml:space="preserve"><tspan class="pr">Router#</tspan>show ip int brief</text>
<text x="30" y="376" class="term" xml:space="preserve"><tspan class="dim">(Tab completes a partial word; ? after a word lists what can follow it)</tspan></text>
<rect x="79" y="58" width="76" height="18" rx="3" fill="none" stroke="#FFD76A" stroke-width="1.8"/>
<line x1="157" y1="67.0" x2="454" y2="67.0" stroke="#FFD76A" stroke-width="1.5"/>
<text x="460" y="71.0" class="note" style="fill:#FFD76A;">? lists every valid next word</text>
<rect x="139" y="292" width="38" height="18" rx="3" fill="none" stroke="#FFD76A" stroke-width="1.8"/>
<line x1="179" y1="301.0" x2="454" y2="301.0" stroke="#FFD76A" stroke-width="1.5"/>
<text x="460" y="305.0" class="note" style="fill:#FFD76A;">partial word + ? lists matches</text>
<text x="16" y="432" class="lbl-sm" style="font-style:italic;">*Schematic layout - not a live screenshot. The real list is longer (press Space at --More--) and its exact entries depend on the IOS version.</text>
</svg>
