<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ifstate-title">
<title id="ifstate-title">Matrix of interface state combinations — physical status versus line protocol status — each with one likely cause</title>
<style>
  .lbl { font-family: system-ui, -apple-system, sans-serif; fill: #1A1A1A; font-size: 15px; font-weight: 700; }
  .lbl-sm { font-family: system-ui, -apple-system, sans-serif; fill: #5B6B78; font-size: 12.5px; }
  .lbl-hd { font-family: system-ui, -apple-system, sans-serif; fill: #0C3274; font-size: 13px; font-weight: 700; }
  .lbl-title { font-family: system-ui, -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 600; }
</style>

<rect x="4" y="4" width="892" height="512" rx="10" fill="#ffffff" stroke="#0C3274" stroke-width="2"/>
<rect x="4" y="4" width="892" height="32" rx="10" fill="#0C3274"/>
<rect x="4" y="20" width="892" height="16" fill="#0C3274"/>
<text x="20" y="25" class="lbl-title">Interface states — physical status versus line protocol status</text>

<!-- column headers -->
<text x="315" y="66" text-anchor="middle" class="lbl-hd">Line protocol (Layer 2): Up</text>
<text x="695" y="66" text-anchor="middle" class="lbl-hd">Line protocol (Layer 2): Down</text>

<!-- row headers -->
<text x="30" y="185" class="lbl-hd">Physical</text>
<text x="30" y="202" class="lbl-hd">(Layer 1):</text>
<text x="30" y="219" class="lbl-hd">Up</text>
<text x="30" y="345" class="lbl-hd">Physical</text>
<text x="30" y="362" class="lbl-hd">(Layer 1):</text>
<text x="30" y="379" class="lbl-hd">Down</text>

<!-- Cell: up / up -->
<rect x="140" y="90" width="350" height="150" rx="8" fill="#E3F3F1" stroke="#00A79E" stroke-width="1.5"/>
<text x="315" y="122" text-anchor="middle" class="lbl">up / up</text>
<text x="315" y="150" text-anchor="middle" class="lbl-sm">Normal operation — cable connected,</text>
<text x="315" y="168" text-anchor="middle" class="lbl-sm">both ends configured and functioning</text>
<text x="315" y="186" text-anchor="middle" class="lbl-sm">correctly. Nothing to fix.</text>

<!-- Cell: up / down -->
<rect x="520" y="90" width="350" height="150" rx="8" fill="#FFF8F1" stroke="#E8792A" stroke-width="1.5"/>
<text x="695" y="122" text-anchor="middle" class="lbl">up / down</text>
<text x="695" y="150" text-anchor="middle" class="lbl-sm">Layer 1 is fine, Layer 2 isn't — often</text>
<text x="695" y="168" text-anchor="middle" class="lbl-sm">an encapsulation mismatch or the far</text>
<text x="695" y="186" text-anchor="middle" class="lbl-sm">end is sending no keepalives.</text>

<!-- Cell: down / up (impossible) -->
<rect x="140" y="250" width="350" height="150" rx="8" fill="#F6F8FA" stroke="#B7C2CB" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="315" y="282" text-anchor="middle" class="lbl" style="fill:#7A8699;">not possible</text>
<text x="315" y="310" text-anchor="middle" class="lbl-sm">Line protocol cannot be up while</text>
<text x="315" y="328" text-anchor="middle" class="lbl-sm">physical is down — Layer 2 always</text>
<text x="315" y="346" text-anchor="middle" class="lbl-sm">depends on Layer 1 first.</text>

<!-- Cell: down / down -->
<rect x="520" y="250" width="350" height="150" rx="8" fill="#FDECEC" stroke="#C0392B" stroke-width="1.5"/>
<text x="695" y="282" text-anchor="middle" class="lbl">down / down</text>
<text x="695" y="310" text-anchor="middle" class="lbl-sm">Physical problem — cable unplugged,</text>
<text x="695" y="328" text-anchor="middle" class="lbl-sm">bad cable, or the remote end is</text>
<text x="695" y="346" text-anchor="middle" class="lbl-sm">powered off.</text>

<!-- administratively down banner -->
<rect x="140" y="420" width="730" height="70" rx="8" fill="#F2F2F2" stroke="#0C3274" stroke-width="1.5"/>
<text x="165" y="448" class="lbl" style="font-size:14px;">administratively down (always shows as down / down)</text>
<text x="165" y="470" class="lbl-sm">Not a real fault — someone ran the <tspan style="font-family:monospace;font-weight:700;">shutdown</tspan> command on purpose. Fix: <tspan style="font-family:monospace;font-weight:700;">no shutdown</tspan>, not a new cable.</text>

<text x="24" y="508" class="lbl-sm" style="font-style:italic;">Schematic — box sizes are illustrative, not proportional to how often each state occurs.</text>
</svg>
