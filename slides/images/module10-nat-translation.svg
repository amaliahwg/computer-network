<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nat-title">
<title id="nat-title">Diagram of NAT/PAT rewriting a packet's source address and port as it crosses the router, with the translation table</title>
<style>
  .lbl { font-family: system-ui, -apple-system, sans-serif; fill: #1A1A1A; font-size: 13px; }
  .lbl-sm { font-family: system-ui, -apple-system, sans-serif; fill: #5B6B78; font-size: 12px; }
  .lbl-w { font-family: system-ui, -apple-system, sans-serif; fill: #ffffff; font-size: 13px; font-weight: 600; }
  .lbl-title { font-family: system-ui, -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 600; }
</style>
<defs>
  <marker id="natArrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#145DA0"/>
  </marker>
  <marker id="natArrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#E8792A"/>
  </marker>
</defs>

<rect x="4" y="4" width="892" height="452" rx="10" fill="#ffffff" stroke="#0C3274" stroke-width="2"/>
<rect x="4" y="4" width="892" height="32" rx="10" fill="#0C3274"/>
<rect x="4" y="20" width="892" height="16" fill="#0C3274"/>
<text x="20" y="25" class="lbl-title">NAT/PAT - the router rewrites source IP and port as the packet crosses</text>

<text x="40" y="70" class="lbl-sm" style="font-weight:600;">Inside (private)</text>
<text x="760" y="70" class="lbl-sm" style="font-weight:600;">Outside (public)</text>

<!-- inside host -->
<rect x="40" y="90" width="50" height="36" rx="4" fill="#145DA0"/>
<text x="65" y="140" text-anchor="middle" class="lbl-sm">Host</text>
<text x="65" y="156" text-anchor="middle" class="lbl-sm" style="font-weight:600;">192.168.1.10:3345</text>

<!-- router -->
<rect x="350" y="90" width="200" height="60" rx="8" fill="#0C3274"/>
<text x="450" y="115" text-anchor="middle" class="lbl-w">R0 - NAT / PAT</text>
<text x="450" y="135" text-anchor="middle" class="lbl-sm" style="fill:#D7E1E8;">rewrites source IP:port</text>

<!-- outside host -->
<rect x="800" y="90" width="50" height="36" rx="4" fill="#5B6B78"/>
<text x="825" y="140" text-anchor="middle" class="lbl-sm">Outside host</text>

<!-- arrow host -> router -->
<line x1="90" y1="108" x2="350" y2="108" stroke="#145DA0" stroke-width="2.5" marker-end="url(#natArrowBlue)"/>
<text x="220" y="98" text-anchor="middle" class="lbl-sm" style="fill:#145DA0;font-weight:600;">src 192.168.1.10:3345</text>

<!-- arrow router -> outside -->
<line x1="550" y1="108" x2="800" y2="108" stroke="#E8792A" stroke-width="2.5" marker-end="url(#natArrowGold)"/>
<text x="675" y="98" text-anchor="middle" class="lbl-sm" style="fill:#E8792A;font-weight:600;">src 203.0.113.5:3345</text>
<text x="675" y="150" text-anchor="middle" class="lbl-sm" style="font-style:italic;">source rewritten here</text>

<!-- translation table -->
<text x="40" y="220" class="lbl" style="font-weight:700;fill:#0C3274;">NAT Translation Table</text>
<rect x="40" y="234" width="700" height="40" fill="#145DA0"/>
<text x="220" y="259" text-anchor="middle" class="lbl-w">Inside Local</text>
<text x="560" y="259" text-anchor="middle" class="lbl-w">Inside Global</text>

<rect x="40" y="274" width="700" height="40" fill="#E3F3F1"/>
<text x="220" y="299" text-anchor="middle" class="lbl" style="font-family:monospace;">192.168.1.10:3345</text>
<text x="560" y="299" text-anchor="middle" class="lbl" style="font-family:monospace;">203.0.113.5:3345</text>

<rect x="40" y="336" width="800" height="60" rx="6" fill="#F6F8FA" stroke="#D7E1E8"/>
<text x="56" y="360" class="lbl-sm">The return packet arrives addressed to 203.0.113.5:3345. R0 looks up that</text>
<text x="56" y="378" class="lbl-sm">entry in the table and rewrites the destination back to 192.168.1.10:3345.</text>

<text x="24" y="440" class="lbl-sm" style="font-style:italic;">Schematic - real header fields and table columns simplified for teaching.</text>
</svg>
