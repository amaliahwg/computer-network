<svg viewBox="0 0 900 466" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
<title id="t">Schematic of show ip protocols output for RIP on R0</title>
<style>
  .lbl-title { font-family: system-ui, -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 600; }
  .lbl-sm { font-family: system-ui, -apple-system, sans-serif; fill: #5B6B78; font-size: 12px; }
  .term { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 12.5px; fill: #F6F8FA; white-space: pre; }
  .term-hi { fill: #00A79E; font-weight: 600; }
  .term-new { fill: #FFC27A; }
  .cap { font-family: system-ui, -apple-system, sans-serif; fill: #FFC27A; font-size: 12px; font-weight: 600; }
</style>
<rect x="4" y="4" width="892" height="458" rx="10" fill="#ffffff" stroke="#0C3274" stroke-width="2"/>
<rect x="4" y="4" width="892" height="32" rx="10" fill="#0C3274"/>
<rect x="4" y="20" width="892" height="16" fill="#0C3274"/>
<text x="20" y="25" class="lbl-title">R0 - CLI (Step 6: show ip protocols)</text>
<rect x="16" y="44" width="868" height="378" rx="6" fill="#0C3274" stroke="#00A79E" stroke-width="1.5"/>
<text x="30" y="66" class="term" xml:space="preserve"><tspan class="term-hi">R0#</tspan> show ip protocols</text>
<text x="30" y="84" class="term" xml:space="preserve">Routing Protocol is &quot;rip&quot;</text>
<text x="30" y="102" class="term" xml:space="preserve"> Sending updates every 30 seconds, next due in 12 seconds</text>
<text x="30" y="120" class="term" xml:space="preserve"> Invalid after 180 seconds, hold down 180, flushed after 240</text>
<text x="30" y="138" class="term" xml:space="preserve"> Redistributing: rip</text>
<text x="30" y="156" class="term" xml:space="preserve"> Default version control: send version 2, receive 2</text>
<text x="30" y="174" class="term" xml:space="preserve">   Interface             Send  Recv  Triggered RIP  Key-chain</text>
<text x="30" y="192" class="term" xml:space="preserve">   GigabitEthernet0/0    2     2</text>
<text x="30" y="210" class="term" xml:space="preserve">   GigabitEthernet0/1    2     2</text>
<text x="30" y="228" class="term" xml:space="preserve">   GigabitEthernet0/2    2     2</text>
<text x="30" y="246" class="term" xml:space="preserve"> Automatic network summarization is not in effect</text>
<text x="30" y="264" class="term" xml:space="preserve"> Maximum path: 4</text>
<text x="30" y="282" class="term" xml:space="preserve"> Routing for Networks:</text>
<text x="30" y="300" class="term" xml:space="preserve">   10.0.0.0</text>
<text x="30" y="318" class="term" xml:space="preserve">   192.168.1.0</text>
<text x="30" y="336" class="term" xml:space="preserve"> Routing Information Sources:</text>
<text x="30" y="354" class="term" xml:space="preserve">   Gateway         Distance      Last Update</text>
<text x="30" y="372" class="term" xml:space="preserve">   10.0.1.2             120      00:00:08</text>
<text x="30" y="390" class="term" xml:space="preserve">   10.0.3.2             120      00:00:08</text>
<text x="30" y="408" class="term" xml:space="preserve"> Distance: (default is 120)</text>
<text x="16" y="446" class="lbl-sm" style="font-style:italic;">*Schematic layout - not a live screenshot. Trimmed - IOS prints a few extra filter lines. Read: timers, networks, sources, distance.</text>
</svg>
