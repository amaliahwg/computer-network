<text x="456" y="364" class="lbl" style="font-weight:700;">ACL positions</text>
<text x="456" y="390" class="lbl-sm">A (orange): standard ACL 10, R1 Gig0/1, out (near destination)</text>
<text x="456" y="412" class="lbl-sm">B (teal): extended ACL 110, R0 Gig0/0, in (near source)</text>
<text x="456" y="434" class="lbl-sm">C (teal): named ACL BLOCK_WEB, same place as B, replaces it</text>
<text x="456" y="464" class="lbl-sm">Static routes: R0 to 192.168.2.0/24 via 10.0.0.2;</text>
<text x="456" y="482" class="lbl-sm">R1 to 192.168.1.0/24 and 192.168.3.0/24 via 10.0.0.1.</text>
<text x="24" y="546" class="lbl-sm" style="font-style:italic;">Schematic layout - not a live screenshot. Router port labels use the 2911's GigabitEthernet names; switches keep FastEthernet.</text>
