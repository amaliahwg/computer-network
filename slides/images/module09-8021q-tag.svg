<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dot1q-title">
<title id="dot1q-title">Diagram of an untagged Ethernet frame compared to the same frame with an 802.1Q tag inserted</title>
<style>
  .lbl { font-family: system-ui, -apple-system, sans-serif; fill: #1A1A1A; font-size: 14px; }
  .lbl-sm { font-family: system-ui, -apple-system, sans-serif; fill: #5B6B78; font-size: 12px; }
  .lbl-pdu { font-family: system-ui, -apple-system, sans-serif; fill: #ffffff; font-size: 12px; font-weight: 600; }
  .lbl-title { font-family: system-ui, -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 600; }
</style>

<rect x="4" y="4" width="892" height="412" rx="10" fill="#ffffff" stroke="#0C3274" stroke-width="2"/>
<rect x="4" y="4" width="892" height="32" rx="10" fill="#0C3274"/>
<rect x="4" y="20" width="892" height="16" fill="#0C3274"/>
<text x="20" y="25" class="lbl-title">802.1Q — the 4-byte tag inserted on a trunk link</text>

<text x="30" y="70" class="lbl" style="font-weight:600;">Untagged frame — access port</text>
<rect x="30" y="86" width="90" height="44" fill="#0C3274"/>
<text x="75" y="112" text-anchor="middle" class="lbl-pdu">Dest MAC</text>
<rect x="120" y="86" width="90" height="44" fill="#145DA0"/>
<text x="165" y="112" text-anchor="middle" class="lbl-pdu">Src MAC</text>
<rect x="210" y="86" width="70" height="44" fill="#00A79E"/>
<text x="245" y="112" text-anchor="middle" class="lbl-pdu" style="font-size:10px;">EtherType</text>
<rect x="280" y="86" width="440" height="44" fill="#B7C2CB"/>
<text x="500" y="112" text-anchor="middle" class="lbl" style="fill:#1A1A1A;">Payload</text>
<rect x="720" y="86" width="60" height="44" fill="#0C3274"/>
<text x="750" y="112" text-anchor="middle" class="lbl-pdu" style="font-size:10px;">FCS</text>

<text x="30" y="180" class="lbl" style="font-weight:600;">Tagged frame — crossing the trunk link</text>
<rect x="30" y="196" width="90" height="54" fill="#0C3274"/>
<text x="75" y="228" text-anchor="middle" class="lbl-pdu">Dest MAC</text>
<rect x="120" y="196" width="90" height="54" fill="#145DA0"/>
<text x="165" y="228" text-anchor="middle" class="lbl-pdu">Src MAC</text>

<!-- 802.1Q tag, highlighted -->
<rect x="210" y="190" width="100" height="66" rx="4" fill="#E8792A" stroke="#0C3274" stroke-width="2"/>
<text x="260" y="212" text-anchor="middle" class="lbl-pdu" style="font-size:10px;">TPID 0x8100</text>
<text x="260" y="230" text-anchor="middle" class="lbl-pdu" style="font-size:10px;">Priority + CFI</text>
<text x="260" y="248" text-anchor="middle" class="lbl-pdu" style="font-size:11px;font-weight:700;">VLAN ID = 10</text>

<rect x="310" y="196" width="70" height="54" fill="#00A79E"/>
<text x="345" y="228" text-anchor="middle" class="lbl-pdu" style="font-size:10px;">EtherType</text>
<rect x="380" y="196" width="340" height="54" fill="#B7C2CB"/>
<text x="550" y="228" text-anchor="middle" class="lbl" style="fill:#1A1A1A;">Payload</text>
<rect x="720" y="196" width="60" height="54" fill="#0C3274"/>
<text x="750" y="228" text-anchor="middle" class="lbl-pdu" style="font-size:10px;">FCS</text>

<!-- callout line from tag to annotation -->
<line x1="260" y1="190" x2="260" y2="160" stroke="#E8792A" stroke-width="2"/>
<text x="260" y="150" text-anchor="middle" class="lbl-sm" style="fill:#E8792A;font-weight:600;">4 bytes inserted here</text>

<rect x="30" y="290" width="750" height="46" rx="6" fill="#E3F3F1" stroke="#00A79E"/>
<text x="46" y="313" class="lbl" style="fill:#0C3274;">Inserted on the trunk link carrying multiple VLANs; the switch strips the tag before</text>
<text x="46" y="329" class="lbl" style="fill:#0C3274;">delivery to an access port — the end device never sees an 802.1Q tag.</text>

<text x="24" y="398" class="lbl-sm" style="font-style:italic;">Schematic — field widths are illustrative, not to scale with real byte counts.</text>
</svg>
