<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="relay-title">
<title id="relay-title">Diagram of a DHCP relay agent converting a client's broadcast Discover into a unicast packet toward the server</title>
<style>
  .lbl { font-family: system-ui, -apple-system, sans-serif; fill: #1A1A1A; font-size: 13px; }
  .lbl-sm { font-family: system-ui, -apple-system, sans-serif; fill: #5B6B78; font-size: 12px; }
  .lbl-w { font-family: system-ui, -apple-system, sans-serif; fill: #ffffff; font-size: 13px; font-weight: 600; }
  .lbl-title { font-family: system-ui, -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 600; }
</style>
<defs>
  <marker id="relayGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#E8792A"/>
  </marker>
  <marker id="relayBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#145DA0"/>
  </marker>
  <marker id="relayTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#00A79E"/>
  </marker>
</defs>

<rect x="4" y="4" width="892" height="452" rx="10" fill="#ffffff" stroke="#0C3274" stroke-width="2"/>
<rect x="4" y="4" width="892" height="32" rx="10" fill="#0C3274"/>
<rect x="4" y="20" width="892" height="16" fill="#0C3274"/>
<text x="20" y="25" class="lbl-title">DHCP relay — broadcast on the client subnet becomes unicast toward the server</text>

<!-- client -->
<rect x="60" y="150" width="50" height="36" rx="4" fill="#0C3274"/>
<text x="85" y="204" text-anchor="middle" class="lbl-sm">Client</text>

<!-- relay router -->
<rect x="380" y="140" width="180" height="60" rx="8" fill="#5B6B78"/>
<text x="470" y="165" text-anchor="middle" class="lbl-w">R1 — relay agent</text>
<text x="470" y="185" text-anchor="middle" class="lbl-sm" style="fill:#E3F3F1;">ip helper-address</text>

<!-- server -->
<rect x="790" y="150" width="60" height="36" rx="4" fill="#0C3274"/>
<text x="820" y="204" text-anchor="middle" class="lbl-sm">DHCP Server</text>

<!-- forward path: client -> relay, broadcast dashed -->
<line x1="110" y1="168" x2="380" y2="168" stroke="#E8792A" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#relayGold)"/>
<text x="245" y="152" text-anchor="middle" class="lbl-sm" style="fill:#E8792A;font-weight:700;">DISCOVER — broadcast</text>
<text x="245" y="225" text-anchor="middle" class="lbl-sm" style="font-style:italic;">cannot cross a router on its own</text>

<!-- relay -> server, unicast solid -->
<line x1="560" y1="168" x2="790" y2="168" stroke="#145DA0" stroke-width="2.5" marker-end="url(#relayBlue)"/>
<text x="675" y="152" text-anchor="middle" class="lbl-sm" style="fill:#145DA0;font-weight:700;">DISCOVER — unicast, dst = server</text>

<!-- return path: server -> relay, unicast -->
<line x1="790" y1="240" x2="560" y2="240" stroke="#00A79E" stroke-width="2.5" marker-end="url(#relayTeal)"/>
<text x="675" y="260" text-anchor="middle" class="lbl-sm" style="fill:#00A79E;font-weight:700;">OFFER / ACK — unicast to relay</text>

<!-- relay -> client -->
<line x1="380" y1="240" x2="110" y2="240" stroke="#00A79E" stroke-width="2.5" marker-end="url(#relayTeal)"/>
<text x="245" y="260" text-anchor="middle" class="lbl-sm" style="fill:#00A79E;font-weight:700;">OFFER / ACK — forwarded to client</text>

<rect x="60" y="300" width="790" height="70" rx="8" fill="#E3F3F1" stroke="#00A79E" stroke-width="2"/>
<text x="76" y="326" class="lbl-sm" style="font-size:13px;">R1 receives the client's broadcast, rewrites it as a unicast packet addressed to the</text>
<text x="76" y="346" class="lbl-sm" style="font-size:13px;">DHCP server, and stamps its own interface address in the relay (giaddr) field so the</text>
<text x="76" y="364" class="lbl-sm" style="font-size:13px;">server knows which subnet — and which address pool — to answer from.</text>

<text x="24" y="428" class="lbl-sm" style="font-style:italic;">Schematic — without the relay, the broadcast Discover is dropped at the router and never reaches the server.</text>
</svg>
