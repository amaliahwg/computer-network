<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pt-ipconfig-title">
<title id="pt-ipconfig-title">Schematic diagram of the Packet Tracer PC Desktop IP Configuration panel</title>
<style>
  .lbl { font-family: system-ui, -apple-system, sans-serif; fill: #1A1A1A; }
  .lbl-sm { font-family: system-ui, -apple-system, sans-serif; fill: #5B6B78; font-size: 12px; }
  .lbl-title { font-family: system-ui, -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 600; }
  .panel { fill: #ffffff; stroke: #D7E1E8; stroke-width: 1.5; }
  .panel-active { fill: #E3F3F1; stroke: #00A79E; stroke-width: 1.5; }
  .panel-ghost { fill: #F6F8FA; stroke: #D7E1E8; stroke-width: 1.5; stroke-dasharray: 5 4; opacity: 0.85; }
  .state-ok { fill: #00A79E; }
  .state-warn { fill: #F2A900; }
  .state-bad { fill: #D64545; }
</style>

<!-- window frame -->
<rect x="4" y="4" width="892" height="512" rx="10" fill="#ffffff" stroke="#0C3274" stroke-width="2"/>

<!-- title bar -->
<rect x="4" y="4" width="892" height="32" rx="10" fill="#0C3274"/>
<rect x="4" y="20" width="892" height="16" fill="#0C3274"/>
<text x="20" y="25" class="lbl-title">PC0 - Desktop</text>
<circle cx="850" cy="20" r="5" fill="#00A79E"/>
<circle cx="868" cy="20" r="5" fill="#E3F3F1"/>

<!-- Desktop / Config tabs -->
<rect x="16" y="44" width="110" height="24" rx="4" class="panel-active"/>
<text x="71" y="60" text-anchor="middle" class="lbl-sm" style="fill:#0C3274;font-weight:600;">Desktop</text>
<rect x="130" y="44" width="110" height="24" rx="4" class="panel"/>
<text x="185" y="60" text-anchor="middle" class="lbl-sm">Config</text>

<!-- left nav: desktop apps -->
<rect x="16" y="82" width="200" height="400" rx="6" class="panel"/>
<text x="30" y="104" class="lbl-sm" style="font-weight:600;">Desktop Apps</text>
<rect x="28" y="116" width="176" height="28" rx="4" class="panel-active"/>
<text x="40" y="134" class="lbl-sm" style="fill:#0C3274;font-weight:600;">IP Configuration</text>
<rect x="28" y="150" width="176" height="28" rx="4" class="panel"/>
<text x="40" y="168" class="lbl-sm">Command Prompt</text>
<rect x="28" y="184" width="176" height="28" rx="4" class="panel"/>
<text x="40" y="202" class="lbl-sm">Web Browser</text>
<rect x="28" y="218" width="176" height="28" rx="4" class="panel-ghost"/>
<text x="40" y="236" class="lbl-sm">PC Wireless</text>

<!-- main IP configuration panel -->
<rect x="230" y="82" width="650" height="400" rx="6" fill="#FAFBFC" stroke="#D7E1E8" stroke-width="1.5"/>
<text x="250" y="110" class="lbl" style="font-size:14px;font-weight:600;">IP CONFIGURATION</text>

<!-- radio buttons: DHCP / Static -->
<circle cx="257" cy="140" r="7" fill="#ffffff" stroke="#0C3274" stroke-width="1.5"/>
<text x="272" y="145" class="lbl-sm">DHCP</text>
<circle cx="357" cy="140" r="7" fill="#ffffff" stroke="#00A79E" stroke-width="1.5"/>
<circle cx="357" cy="140" r="3" class="state-ok"/>
<text x="372" y="145" class="lbl-sm" style="fill:#0C3274;font-weight:600;">Static</text>

<!-- fields -->
<text x="250" y="182" class="lbl-sm">IP Address</text>
<rect x="400" y="167" width="300" height="26" rx="3" class="panel"/>
<text x="412" y="184" class="lbl-sm" style="fill:#1A1A1A;">192.168.1.10</text>

<text x="250" y="222" class="lbl-sm">Subnet Mask</text>
<rect x="400" y="207" width="300" height="26" rx="3" class="panel"/>
<text x="412" y="224" class="lbl-sm" style="fill:#1A1A1A;">255.255.255.0</text>

<text x="250" y="262" class="lbl-sm">Default Gateway</text>
<rect x="400" y="247" width="300" height="26" rx="3" class="panel"/>
<text x="412" y="264" class="lbl-sm" style="fill:#1A1A1A;">192.168.1.1</text>

<text x="250" y="302" class="lbl-sm">DNS Server</text>
<rect x="400" y="287" width="300" height="26" rx="3" class="panel"/>
<text x="412" y="304" class="lbl-sm" style="fill:#1A1A1A;">192.168.1.1</text>

<line x1="250" y1="335" x2="850" y2="335" stroke="#D7E1E8" stroke-width="1"/>

<!-- DHCP states reference -->
<text x="250" y="362" class="lbl-sm" style="font-weight:600;">DHCP STATES REFERENCE (select DHCP above to see one of these)</text>
<rect x="250" y="374" width="600" height="92" rx="6" class="panel-ghost"/>

<circle cx="270" cy="396" r="5" class="state-ok"/>
<text x="285" y="400" class="lbl-sm">IP Address: 192.168.1.21 (DHCP assigned - success)</text>

<circle cx="270" cy="422" r="5" class="state-warn"/>
<text x="285" y="426" class="lbl-sm">Obtaining IP address via DHCP... (in progress)</text>

<circle cx="270" cy="448" r="5" class="state-bad"/>
<text x="285" y="452" class="lbl-sm">0.0.0.0 (no response - check routing / DHCP relay)</text>

<text x="16" y="502" class="lbl-sm" style="font-style:italic;">*Schematic layout - not a live screenshot. Field values shown are examples; PT panel styling may vary slightly by release.</text>
</svg>
