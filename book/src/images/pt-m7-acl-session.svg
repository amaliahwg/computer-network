<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m7s-t">
<title id="m7s-t">Schematic of a Packet Tracer CLI session creating a named extended ACL and applying it to an interface</title>
<style>
  .lbl { font-family: system-ui, -apple-system, sans-serif; fill: #1A1A1A; font-size: 13px; }
  .lbl-sm { font-family: system-ui, -apple-system, sans-serif; fill: #5B6B78; font-size: 12px; }
  .lbl-w { font-family: system-ui, -apple-system, sans-serif; fill: #ffffff; font-size: 12px; font-weight: 600; }
  .lbl-title { font-family: system-ui, -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 600; }
  .term { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 12.5px; fill: #F6F8FA; }
  .term-hi { fill: #00A79E; font-weight: 600; }
  .term-bad { fill: #FFB4B4; font-weight: 600; }
  .term-key { fill: #F2A900; font-weight: 600; }
  .mono { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 12.5px; fill: #0C3274; font-weight: 600; }
  .dev { fill: #0C3274; }
</style>
<rect x="4" y="4" width="892" height="462" rx="10" fill="#ffffff" stroke="#0C3274" stroke-width="2"/>
<rect x="4" y="4" width="892" height="32" rx="10" fill="#0C3274"/>
<rect x="4" y="20" width="892" height="16" fill="#0C3274"/>
<text x="20" y="25" class="lbl-title">R0 - CLI</text>
<rect x="16" y="48" width="868" height="210" rx="6" fill="#0C3274" stroke="#00A79E" stroke-width="1.5"/>
<text x="30" y="70" class="term" xml:space="preserve"><tspan class="term-hi">R0&gt;</tspan> enable</text>
<text x="30" y="89" class="term" xml:space="preserve"><tspan class="term-hi">R0#</tspan> configure terminal</text>
<text x="30" y="108" class="term" xml:space="preserve"><tspan class="term-hi">R0(config)#</tspan> ip access-list extended BLOCK_WEB</text>
<text x="30" y="127" class="term" xml:space="preserve"><tspan class="term-hi">R0(config-ext-nacl)#</tspan> deny tcp host 192.168.1.20 host 192.168.2.100 eq www</text>
<text x="30" y="146" class="term" xml:space="preserve"><tspan class="term-hi">R0(config-ext-nacl)#</tspan> permit ip any any</text>
<text x="30" y="165" class="term" xml:space="preserve"><tspan class="term-hi">R0(config-ext-nacl)#</tspan> exit</text>
<text x="30" y="184" class="term" xml:space="preserve"><tspan class="term-hi">R0(config)#</tspan> interface GigabitEthernet0/0</text>
<text x="30" y="203" class="term" xml:space="preserve"><tspan class="term-hi">R0(config-if)#</tspan> ip access-group BLOCK_WEB in</text>
<text x="30" y="222" class="term" xml:space="preserve"><tspan class="term-hi">R0(config-if)#</tspan> end</text>
<text x="30" y="241" class="term" xml:space="preserve"><tspan class="term-hi">R0#</tspan> </text>
<rect x="16" y="274" width="868" height="170" rx="6" fill="#ffffff" stroke="#D7E1E8" stroke-width="1.5"/>
<text x="30" y="296" class="lbl" style="font-weight:600;">WHAT EACH PROMPT TELLS YOU</text>
<rect x="30" y="308" width="4" height="18" fill="#00A79E"/>
<text x="46" y="322" class="mono">R0(config)#</text>
<text x="290" y="322" class="lbl-sm">Global configuration - where ip access-list and access-list commands are typed</text>
<rect x="30" y="336" width="4" height="18" fill="#00A79E"/>
<text x="46" y="350" class="mono">R0(config-ext-nacl)#</text>
<text x="290" y="350" class="lbl-sm">Named extended ACL mode - each line you type is one rule, appended in order</text>
<rect x="30" y="364" width="4" height="18" fill="#00A79E"/>
<text x="46" y="378" class="mono">R0(config-if)#</text>
<text x="290" y="378" class="lbl-sm">Interface configuration - ip access-group binds the ACL to this interface and direction</text>
<rect x="30" y="392" width="4" height="18" fill="#00A79E"/>
<text x="46" y="406" class="mono">(no ACL prompt for numbered)</text>
<text x="290" y="406" class="lbl-sm">access-list 110 ... is a single global command; there is no sub-mode</text>
<text x="24" y="456" class="lbl-sm" style="font-style:italic;">Schematic layout - not a live screenshot; counters and addresses in your lab may differ.</text>
</svg>
