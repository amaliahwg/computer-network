<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m7v-t">
<title id="m7v-t">Schematic of the Packet Tracer Server Services tab with the HTTP service switched on</title>
<style>
  .lbl { font-family: system-ui, -apple-system, sans-serif; fill: #1A1A1A; font-size: 13px; }
  .lbl-sm { font-family: system-ui, -apple-system, sans-serif; fill: #5B6B78; font-size: 12px; }
  .lbl-w { font-family: system-ui, -apple-system, sans-serif; fill: #ffffff; font-size: 12px; font-weight: 600; }
  .lbl-title { font-family: system-ui, -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 600; }
  .term { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 12.5px; fill: #F6F8FA; }
  .term-hi { fill: #00A79E; font-weight: 600; }
  .term-bad { fill: #FFB4B4; font-weight: 600; }
  .term-key { fill: #F2A900; font-weight: 600; }
  .mono { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 12.5px; fill: #0C3274; font-weight: 600; }
  .dev { fill: #0C3274; }
</style>
<rect x="4" y="4" width="892" height="392" rx="10" fill="#ffffff" stroke="#0C3274" stroke-width="2"/>
<rect x="4" y="4" width="892" height="32" rx="10" fill="#0C3274"/>
<rect x="4" y="20" width="892" height="16" fill="#0C3274"/>
<text x="20" y="25" class="lbl-title">Server - Services</text>
<rect x="16" y="44" width="110" height="24" rx="4" fill="#ffffff" stroke="#D7E1E8"/><text x="71" y="60" text-anchor="middle" class="lbl-sm">Physical</text>
<rect x="130" y="44" width="110" height="24" rx="4" fill="#ffffff" stroke="#D7E1E8"/><text x="185" y="60" text-anchor="middle" class="lbl-sm">Config</text>
<rect x="244" y="44" width="110" height="24" rx="4" fill="#E3F3F1" stroke="#00A79E" stroke-width="1.5"/><text x="299" y="60" text-anchor="middle" class="lbl-sm" style="fill:#0C3274;font-weight:600;">Services</text>
<rect x="358" y="44" width="110" height="24" rx="4" fill="#ffffff" stroke="#D7E1E8"/><text x="413" y="60" text-anchor="middle" class="lbl-sm">Desktop</text>
<rect x="16" y="80" width="190" height="270" rx="6" fill="#ffffff" stroke="#D7E1E8" stroke-width="1.5"/>
<text x="32" y="102" class="lbl-sm">DHCP</text>
<text x="32" y="130" class="lbl-sm">TFTP</text>
<text x="32" y="158" class="lbl-sm">DNS</text>
<text x="32" y="186" class="lbl-sm">SYSLOG</text>
<text x="32" y="214" class="lbl-sm">AAA</text>
<text x="32" y="242" class="lbl-sm">NTP</text>
<text x="32" y="270" class="lbl-sm">EMAIL</text>
<rect x="20" y="280" width="182" height="26" rx="3" fill="#00A79E"/><text x="32" y="298" class="lbl-w">HTTP</text>
<text x="32" y="326" class="lbl-sm">FTP</text>
<rect x="222" y="80" width="662" height="270" rx="6" fill="#ffffff" stroke="#D7E1E8" stroke-width="1.5"/>
<text x="240" y="108" class="lbl" style="font-weight:600;">HTTP</text>
<text x="240" y="140" class="lbl">HTTP</text><rect x="320" y="126" width="60" height="22" rx="3" fill="#00A79E"/><text x="350" y="142" text-anchor="middle" class="lbl-w">On</text><rect x="384" y="126" width="60" height="22" rx="3" fill="#ffffff" stroke="#D7E1E8"/><text x="414" y="142" text-anchor="middle" class="lbl-sm">Off</text>
<text x="240" y="176" class="lbl">HTTPS</text><rect x="320" y="162" width="60" height="22" rx="3" fill="#00A79E"/><text x="350" y="178" text-anchor="middle" class="lbl-w">On</text><rect x="384" y="162" width="60" height="22" rx="3" fill="#ffffff" stroke="#D7E1E8"/><text x="414" y="178" text-anchor="middle" class="lbl-sm">Off</text>
<text x="240" y="220" class="lbl-sm">index.html   (the default page the browser loads)</text>
<text x="240" y="244" class="lbl-sm">Both are On by default. Check it only if the browser fails</text>
<text x="240" y="262" class="lbl-sm">even before you apply any ACL.</text>
<text x="24" y="386" class="lbl-sm" style="font-style:italic;">Schematic layout - not a live screenshot; the service list in your version may have more entries.</text>
</svg>
