<svg viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chap-title">
<title id="chap-title">Sequence diagram of the CHAP three-way challenge-response handshake between two routers</title>
<style>
  .lbl { font-family: system-ui, -apple-system, sans-serif; fill: #1A1A1A; font-size: 13px; }
  .lbl-sm { font-family: system-ui, -apple-system, sans-serif; fill: #5B6B78; font-size: 12px; }
  .lbl-w { font-family: system-ui, -apple-system, sans-serif; fill: #ffffff; font-size: 13px; font-weight: 600; }
  .lbl-title { font-family: system-ui, -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 600; }
</style>
<defs>
  <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#E8792A"/>
  </marker>
  <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#00A79E"/>
  </marker>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#145DA0"/>
  </marker>
</defs>

<rect x="4" y="4" width="892" height="432" rx="10" fill="#ffffff" stroke="#0C3274" stroke-width="2"/>
<rect x="4" y="4" width="892" height="32" rx="10" fill="#0C3274"/>
<rect x="4" y="20" width="892" height="16" fill="#0C3274"/>
<text x="20" y="25" class="lbl-title">CHAP — three-way challenge/response, password never crosses the link</text>

<!-- lifeline boxes -->
<rect x="140" y="56" width="160" height="44" rx="6" fill="#0C3274"/>
<text x="220" y="83" text-anchor="middle" class="lbl-w">R0 (authenticator)</text>
<rect x="600" y="56" width="160" height="44" rx="6" fill="#0C3274"/>
<text x="680" y="83" text-anchor="middle" class="lbl-w">R1 (responder)</text>

<!-- lifelines -->
<line x1="220" y1="100" x2="220" y2="380" stroke="#B7C2CB" stroke-width="2"/>
<line x1="680" y1="100" x2="680" y2="380" stroke="#B7C2CB" stroke-width="2"/>

<!-- step 1: challenge -->
<line x1="220" y1="150" x2="680" y2="150" stroke="#E8792A" stroke-width="2.5" marker-end="url(#arrowGold)"/>
<text x="450" y="132" text-anchor="middle" class="lbl" style="fill:#E8792A;font-weight:700;">① Challenge — random value + hostname "R0"</text>

<!-- step 2: response -->
<line x1="680" y1="220" x2="220" y2="220" stroke="#00A79E" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
<text x="450" y="202" text-anchor="middle" class="lbl" style="fill:#00A79E;font-weight:700;">② Response — MD5 hash of (challenge + password + seq #)</text>
<text x="450" y="240" text-anchor="middle" class="lbl-sm">R1 never sends the password itself, only the hash.</text>

<!-- step 3: success -->
<line x1="220" y1="300" x2="680" y2="300" stroke="#145DA0" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
<text x="450" y="282" text-anchor="middle" class="lbl" style="fill:#145DA0;font-weight:700;">③ Success — R0 recomputes the hash locally and it matches</text>
<text x="450" y="320" text-anchor="middle" class="lbl-sm" style="font-style:italic;">(Failure, dashed, if the locally computed hash does not match)</text>
<line x1="220" y1="330" x2="680" y2="330" stroke="#B7C2CB" stroke-width="2" stroke-dasharray="5 3"/>

<text x="24" y="410" class="lbl-sm" style="font-style:italic;">Schematic — R0 authenticates R1 here; CHAP can run in both directions on the same link.</text>
</svg>
