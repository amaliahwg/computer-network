<svg viewBox="0 0 900 376" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
<title id="t">Schematic of show ip route on R0 with RIP-learned R entries</title>
<style>
  .lbl-title { font-family: system-ui, -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 600; }
  .lbl-sm { font-family: system-ui, -apple-system, sans-serif; fill: #5B6B78; font-size: 12px; }
  .term { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 12.5px; fill: #F6F8FA; white-space: pre; }
  .term-hi { fill: #00A79E; font-weight: 600; }
  .term-new { fill: #FFC27A; }
  .cap { font-family: system-ui, -apple-system, sans-serif; fill: #FFC27A; font-size: 12px; font-weight: 600; }
</style>
<rect x="4" y="4" width="892" height="368" rx="10" fill="#ffffff" stroke="#0C3274" stroke-width="2"/>
<rect x="4" y="4" width="892" height="32" rx="10" fill="#0C3274"/>
<rect x="4" y="20" width="892" height="16" fill="#0C3274"/>
<text x="20" y="25" class="lbl-title">R0 - CLI (Step 4: RIP-learned routes)</text>
<rect x="16" y="44" width="868" height="288" rx="6" fill="#0C3274" stroke="#00A79E" stroke-width="1.5"/>
<text x="30" y="66" class="term" xml:space="preserve"><tspan class="term-hi">R0#</tspan> show ip route</text>
<text x="30" y="84" class="term" xml:space="preserve">Codes: C - connected, L - local, R - RIP, D - EIGRP, S - static</text>
<text x="30" y="102" class="term" xml:space="preserve">Gateway of last resort is not set</text>
<text x="30" y="120" class="term" xml:space="preserve"></text>
<text x="30" y="138" class="term" xml:space="preserve">      10.0.0.0/8 is variably subnetted, 5 subnets, 2 masks</text>
<text x="30" y="156" class="term" xml:space="preserve">C        10.0.1.0/30 is directly connected, GigabitEthernet0/1</text>
<text x="30" y="174" class="term" xml:space="preserve">L        10.0.1.1/32 is directly connected, GigabitEthernet0/1</text>
<text x="30" y="192" class="term term-new" xml:space="preserve">R        10.0.2.0/30 [120/1] via 10.0.1.2, 00:00:12, GigabitEthernet0/1</text>
<text x="30" y="210" class="term term-new" xml:space="preserve">                     [120/1] via 10.0.3.2, 00:00:12, GigabitEthernet0/2</text>
<text x="30" y="228" class="term" xml:space="preserve">C        10.0.3.0/30 is directly connected, GigabitEthernet0/2</text>
<text x="30" y="246" class="term" xml:space="preserve">L        10.0.3.1/32 is directly connected, GigabitEthernet0/2</text>
<text x="30" y="264" class="term" xml:space="preserve">C     192.168.1.0/24 is directly connected, GigabitEthernet0/0</text>
<text x="30" y="282" class="term" xml:space="preserve">L     192.168.1.1/32 is directly connected, GigabitEthernet0/0</text>
<text x="30" y="300" class="term term-new" xml:space="preserve">R     192.168.2.0/24 [120/1] via 10.0.3.2, 00:00:12, GigabitEthernet0/2</text>
<text x="30" y="318" class="term term-new" xml:space="preserve">R     192.168.3.0/24 [120/1] via 10.0.1.2, 00:00:12, GigabitEthernet0/1</text>
<text x="16" y="356" class="lbl-sm" style="font-style:italic;">*Schematic layout - not a live screenshot. Orange = RIP-learned. [120/1] is [administrative distance / metric]; ages and ordering will differ.</text>
</svg>
