<svg viewBox="0 0 900 528" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m7d-t">
<title id="m7d-t">Diagram showing an inbound ACL checked before the router decides where to send a packet and an outbound ACL checked after</title>
<style>
  .lbl { font-family: system-ui, -apple-system, sans-serif; fill: #1A1A1A; font-size: 13px; }
  .lbl-sm { font-family: system-ui, -apple-system, sans-serif; fill: #5B6B78; font-size: 12px; }
  .lbl-w { font-family: system-ui, -apple-system, sans-serif; fill: #ffffff; font-size: 12px; font-weight: 600; }
  .lbl-title { font-family: system-ui, -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 600; }
  .term { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 12.5px; fill: #F6F8FA; }
  .term-hi { fill: #00A79E; font-weight: 600; }
  .term-bad { fill: #FFB4B4; font-weight: 600; }
  .term-key { fill: #F2A900; font-weight: 600; }
  .mono { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 12.5px; fill: #0C3274; font-weight: 600; }
  .dev { fill: #0C3274; }
</style>
<rect x="4" y="4" width="892" height="520" rx="10" fill="#ffffff" stroke="#0C3274" stroke-width="2"/>
<rect x="4" y="4" width="892" height="32" rx="10" fill="#0C3274"/>
<rect x="4" y="20" width="892" height="16" fill="#0C3274"/>
<text x="20" y="25" class="lbl-title">ACL direction is relative to the router interface</text>
<rect x="24" y="48" width="852" height="212" rx="8" fill="#E3F3F1" stroke="#00A79E"/>
<text x="40" y="72" class="lbl" style="font-weight:700;fill:#0C3274;">Inbound: "in" means packets entering the router through this interface</text>
<rect x="50" y="126" width="100" height="36" rx="4" class="dev"/><text x="100" y="149" text-anchor="middle" class="lbl-w">Source LAN</text>
<rect x="700" y="126" width="150" height="36" rx="4" class="dev"/><text x="775" y="149" text-anchor="middle" class="lbl-w">Destination LAN</text>
<rect x="340" y="110" width="220" height="68" rx="8" class="dev"/><text x="450" y="138" text-anchor="middle" class="lbl-w" style="font-size:14px;">Router</text><text x="450" y="158" text-anchor="middle" class="lbl-w" style="font-size:11px;">routing decision</text>
<line x1="150" y1="144" x2="340" y2="144" stroke="#5B6B78" stroke-width="2"/><line x1="560" y1="144" x2="700" y2="144" stroke="#5B6B78" stroke-width="2"/>
<text x="345" y="190" class="lbl-sm">Gig0/0</text><text x="520" y="190" class="lbl-sm">Gig0/1</text>
<circle cx="290" cy="144" r="19" fill="#00A79E"/><text x="290" y="148" text-anchor="middle" class="lbl-w" style="font-size:11px;">ACL</text>
<text x="290" y="110" text-anchor="middle" class="lbl" style="font-weight:700;fill:#00A79E;">ip access-group 110 in</text>
<text x="40" y="220" class="lbl-sm">Checked as the packet ARRIVES on Gig0/0, before the router looks up a route. A denied packet never goes further.</text>
<text x="40" y="240" class="lbl-sm">Best spot for an extended ACL near the source: the unwanted traffic is dropped at the first router it meets.</text>
<polygon points="180,136 200,144 180,152" fill="#E8792A"/><text x="165" y="130" class="lbl-sm">packet</text>
<rect x="24" y="268" width="852" height="212" rx="8" fill="#F6F8FA" stroke="#D7E1E8"/>
<text x="40" y="292" class="lbl" style="font-weight:700;fill:#0C3274;">Outbound: "out" means packets leaving the router through this interface</text>
<rect x="50" y="346" width="100" height="36" rx="4" class="dev"/><text x="100" y="369" text-anchor="middle" class="lbl-w">Source LAN</text>
<rect x="700" y="346" width="150" height="36" rx="4" class="dev"/><text x="775" y="369" text-anchor="middle" class="lbl-w">Destination LAN</text>
<rect x="340" y="330" width="220" height="68" rx="8" class="dev"/><text x="450" y="358" text-anchor="middle" class="lbl-w" style="font-size:14px;">Router</text><text x="450" y="378" text-anchor="middle" class="lbl-w" style="font-size:11px;">routing decision</text>
<line x1="150" y1="364" x2="340" y2="364" stroke="#5B6B78" stroke-width="2"/><line x1="560" y1="364" x2="700" y2="364" stroke="#5B6B78" stroke-width="2"/>
<text x="345" y="410" class="lbl-sm">Gig0/0</text><text x="520" y="410" class="lbl-sm">Gig0/1</text>
<circle cx="610" cy="364" r="19" fill="#00A79E"/><text x="610" y="368" text-anchor="middle" class="lbl-w" style="font-size:11px;">ACL</text>
<text x="640" y="330" text-anchor="middle" class="lbl" style="font-weight:700;fill:#00A79E;">ip access-group 10 out</text>
<text x="40" y="440" class="lbl-sm">Checked as the packet LEAVES on Gig0/1, after the routing decision. Traffic that arrives on other interfaces is also filtered here.</text>
<text x="40" y="460" class="lbl-sm">Best spot for a standard ACL near the destination: one rule guards everything leading to the protected LAN.</text>
<polygon points="180,356 200,364 180,372" fill="#E8792A"/><text x="165" y="350" class="lbl-sm">packet</text>
<text x="24" y="514" class="lbl-sm" style="font-style:italic;">Schematic - direction is always from the router's point of view, never from the network's.</text>
</svg>
