<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arp-title">
<title id="arp-title">Sequence diagram of three numbered steps: ARP broadcast, ARP reply, then ICMP Echo Request</title>
<style>
  .lbl { font-family: system-ui, -apple-system, sans-serif; fill: #1A1A1A; font-size: 13px; }
  .lbl-sm { font-family: system-ui, -apple-system, sans-serif; fill: #5B6B78; font-size: 12px; }
  .lbl-title { font-family: system-ui, -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 600; }
  .badge-num { font-family: system-ui, -apple-system, sans-serif; fill: #ffffff; font-size: 16px; font-weight: 700; }
  .lifeline { stroke: #D7E1E8; stroke-width: 1.5; stroke-dasharray: 2 4; }
</style>

<rect x="4" y="4" width="892" height="552" rx="10" fill="#ffffff" stroke="#0C3274" stroke-width="2"/>
<rect x="4" y="4" width="892" height="32" rx="10" fill="#0C3274"/>
<rect x="4" y="20" width="892" height="16" fill="#0C3274"/>
<text x="20" y="25" class="lbl-title">LAN 1 - ARP before ICMP, in three numbered steps</text>

<rect x="24" y="50" width="852" height="470" rx="8" fill="#F6F8FA" stroke="#D7E1E8"/>
<text x="40" y="72" class="lbl-sm" style="font-weight:600;">LAN 1 (same subnet, one switch)</text>

<!-- devices -->
<rect x="80" y="70" width="40" height="30" rx="4" fill="#0C3274"/>
<text x="100" y="115" text-anchor="middle" class="lbl-sm" style="font-weight:600;">PC0</text>

<rect x="200" y="70" width="40" height="30" rx="4" fill="#5B6B78"/>
<text x="220" y="115" text-anchor="middle" class="lbl-sm" style="font-weight:600;">Switch0</text>

<rect x="500" y="70" width="40" height="30" rx="4" fill="#0C3274"/>
<text x="520" y="115" text-anchor="middle" class="lbl-sm" style="font-weight:600;">PC1</text>

<rect x="800" y="70" width="40" height="30" rx="4" fill="#B7C2CB"/>
<text x="820" y="115" text-anchor="middle" class="lbl-sm" style="font-weight:600;">Router0</text>

<!-- lifelines -->
<line x1="100" y1="125" x2="100" y2="470" class="lifeline"/>
<line x1="220" y1="125" x2="220" y2="470" class="lifeline"/>
<line x1="520" y1="125" x2="520" y2="470" class="lifeline"/>
<line x1="820" y1="125" x2="820" y2="470" class="lifeline"/>

<!-- STEP 1: broadcast -->
<circle cx="40" cy="160" r="16" fill="#E8792A"/>
<text x="40" y="166" text-anchor="middle" class="badge-num">1</text>

<line x1="100" y1="160" x2="220" y2="160" stroke="#E8792A" stroke-width="2" stroke-dasharray="5 3"/>
<polygon points="220,160 212,155 212,165" fill="#E8792A"/>
<line x1="220" y1="160" x2="520" y2="160" stroke="#E8792A" stroke-width="2" stroke-dasharray="5 3"/>
<polygon points="520,160 512,155 512,165" fill="#E8792A"/>
<line x1="220" y1="160" x2="820" y2="160" stroke="#E8792A" stroke-width="2" stroke-dasharray="5 3"/>
<polygon points="820,160 812,155 812,165" fill="#E8792A"/>

<text x="460" y="197" text-anchor="middle" class="lbl" style="fill:#E8792A;font-weight:700;">ARP request (broadcast): "who has 192.168.1.20?"</text>
<text x="460" y="215" text-anchor="middle" class="lbl-sm">Every device on LAN 1 receives it - including Router0.</text>

<text x="820" y="195" text-anchor="middle" class="lbl-sm" style="font-style:italic;">Routers don't forward</text>
<text x="820" y="211" text-anchor="middle" class="lbl-sm" style="font-style:italic;">broadcasts - this ARP</text>
<text x="820" y="227" text-anchor="middle" class="lbl-sm" style="font-style:italic;">request stops here.</text>

<!-- STEP 2: reply -->
<circle cx="40" cy="290" r="16" fill="#00A79E"/>
<text x="40" y="296" text-anchor="middle" class="badge-num">2</text>

<line x1="520" y1="290" x2="100" y2="290" stroke="#00A79E" stroke-width="2.5"/>
<polygon points="100,290 108,285 108,295" fill="#00A79E"/>

<text x="310" y="322" text-anchor="middle" class="lbl" style="fill:#00A79E;font-weight:700;">ARP reply (unicast): "192.168.1.20 is at MAC 00:1A:..."</text>
<text x="310" y="340" text-anchor="middle" class="lbl-sm">Only the device that owns the IP replies.</text>

<!-- STEP 3: icmp -->
<circle cx="40" cy="410" r="16" fill="#145DA0"/>
<text x="40" y="416" text-anchor="middle" class="badge-num">3</text>

<line x1="100" y1="410" x2="520" y2="410" stroke="#145DA0" stroke-width="3"/>
<polygon points="520,410 512,405 512,415" fill="#145DA0"/>

<text x="310" y="442" text-anchor="middle" class="lbl" style="fill:#145DA0;font-weight:700;">ICMP Echo Request - the "ping" message</text>
<text x="310" y="460" text-anchor="middle" class="lbl-sm">Sent now that PC0 knows PC1's MAC address.</text>

<!-- legend -->
<line x1="60" y1="490" x2="100" y2="490" stroke="#E8792A" stroke-width="2" stroke-dasharray="5 3"/>
<text x="108" y="494" class="lbl-sm">Broadcast</text>
<line x1="230" y1="490" x2="270" y2="490" stroke="#00A79E" stroke-width="2.5"/>
<text x="278" y="494" class="lbl-sm">Unicast reply</text>
<line x1="420" y1="490" x2="460" y2="490" stroke="#145DA0" stroke-width="3"/>
<text x="468" y="494" class="lbl-sm">ICMP request</text>

<text x="24" y="538" class="lbl-sm" style="font-style:italic;">Schematic - step numbers show order, not real elapsed time.</text>
</svg>
