<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pt-pdu-title">
<title id="pt-pdu-title">Schematic diagram of the Packet Tracer PDU Information (Inbound/Outbound PDU Details) window</title>
<style>
  .lbl { font-family: system-ui, -apple-system, sans-serif; fill: #1A1A1A; }
  .lbl-sm { font-family: system-ui, -apple-system, sans-serif; fill: #5B6B78; font-size: 12px; }
  .lbl-title { font-family: system-ui, -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 600; }
  .panel { fill: #ffffff; stroke: #D7E1E8; stroke-width: 1.5; }
  .panel-active { fill: #E3F3F1; stroke: #00A79E; stroke-width: 1.5; }
  .panel-ghost { fill: #F6F8FA; stroke: #D7E1E8; stroke-width: 1.5; stroke-dasharray: 5 4; opacity: 0.85; }
  .field-val { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 12px; fill: #0C3274; }
</style>

<!-- window frame -->
<rect x="4" y="4" width="892" height="512" rx="10" fill="#ffffff" stroke="#0C3274" stroke-width="2"/>

<!-- title bar -->
<rect x="4" y="4" width="892" height="32" rx="10" fill="#0C3274"/>
<rect x="4" y="20" width="892" height="16" fill="#0C3274"/>
<text x="20" y="25" class="lbl-title">PDU Information at Device: SW0</text>
<circle cx="850" cy="20" r="5" fill="#00A79E"/>
<circle cx="868" cy="20" r="5" fill="#E3F3F1"/>

<!-- tabs -->
<rect x="16" y="44" width="120" height="24" rx="4" class="panel"/>
<text x="76" y="60" text-anchor="middle" class="lbl-sm">OSI Model</text>
<rect x="140" y="44" width="180" height="24" rx="4" class="panel-active"/>
<text x="230" y="60" text-anchor="middle" class="lbl-sm" style="fill:#0C3274;font-weight:600;">Inbound PDU Details</text>
<rect x="324" y="44" width="180" height="24" rx="4" class="panel"/>
<text x="414" y="60" text-anchor="middle" class="lbl-sm">Outbound PDU Details</text>

<!-- left: OSI mini-ladder -->
<rect x="16" y="82" width="270" height="390" rx="6" class="panel"/>
<text x="30" y="104" class="lbl-sm" style="font-weight:600;">OSI MODEL (this hop)</text>

<rect x="28" y="116" width="246" height="30" rx="4" class="panel"/>
<text x="40" y="135" class="lbl-sm">Layer 7 - Application</text>
<rect x="28" y="150" width="246" height="30" rx="4" class="panel"/>
<text x="40" y="169" class="lbl-sm">Layer 4 - Transport</text>
<rect x="28" y="184" width="246" height="30" rx="4" class="panel"/>
<text x="40" y="203" class="lbl-sm">Layer 3 - Network</text>
<rect x="28" y="218" width="246" height="40" rx="4" class="panel-active"/>
<text x="40" y="235" class="lbl-sm" style="fill:#0C3274;font-weight:600;">Layer 2 - Data Link</text>
<text x="40" y="250" class="lbl-sm" style="fill:#0C3274;">Frame forwarded to next hop</text>
<rect x="28" y="266" width="246" height="30" rx="4" class="panel"/>
<text x="40" y="285" class="lbl-sm">Layer 1 - Physical</text>

<text x="30" y="440" class="lbl-sm" style="font-style:italic;">Click a layer to see that</text>
<text x="30" y="456" class="lbl-sm" style="font-style:italic;">layer's own explanation.</text>

<!-- right: grouped header fields -->
<rect x="300" y="82" width="580" height="390" rx="6" fill="#FAFBFC" stroke="#D7E1E8" stroke-width="1.5"/>

<text x="316" y="104" class="lbl-sm" style="font-weight:600;">Ethernet II</text>
<text x="330" y="122" class="lbl-sm">Destination MAC:</text>
<text x="480" y="122" class="field-val">0060.2F3D.8A01</text>
<text x="330" y="140" class="lbl-sm">Source MAC:</text>
<text x="480" y="140" class="field-val">0090.2B4B.7C22</text>

<line x1="316" y1="152" x2="864" y2="152" stroke="#D7E1E8" stroke-width="1"/>
<text x="316" y="172" class="lbl-sm" style="font-weight:600;">IP</text>
<text x="330" y="190" class="lbl-sm">Source IP:</text>
<text x="480" y="190" class="field-val">192.168.1.10</text>
<text x="330" y="208" class="lbl-sm">Destination IP:</text>
<text x="480" y="208" class="field-val">192.168.2.10</text>
<text x="330" y="226" class="lbl-sm">TTL:</text>
<text x="480" y="226" class="field-val">255</text>

<line x1="316" y1="238" x2="864" y2="238" stroke="#D7E1E8" stroke-width="1"/>
<text x="316" y="258" class="lbl-sm" style="font-weight:600;">TCP / UDP</text>
<text x="330" y="276" class="lbl-sm">Source Port:</text>
<text x="480" y="276" class="field-val">1024</text>
<text x="330" y="294" class="lbl-sm">Destination Port:</text>
<text x="480" y="294" class="field-val">80</text>

<line x1="316" y1="306" x2="864" y2="306" stroke="#D7E1E8" stroke-width="1"/>
<text x="316" y="326" class="lbl-sm" style="font-weight:600;">ICMP</text>
<text x="330" y="344" class="lbl-sm">Type:</text>
<text x="480" y="344" class="field-val">8 (Echo Request)</text>

<rect x="316" y="358" width="548" height="46" rx="4" class="panel-ghost"/>
<text x="330" y="376" class="lbl-sm" style="font-weight:600;">802.1Q (trunk links only)</text>
<text x="330" y="394" class="lbl-sm">VLAN ID: <tspan class="field-val" style="fill:#0C3274;">10</tspan></text>

<rect x="316" y="410" width="548" height="46" rx="4" class="panel-ghost"/>
<text x="330" y="428" class="lbl-sm" style="font-weight:600;">DHCP</text>
<text x="330" y="446" class="lbl-sm">Op: <tspan class="field-val" style="fill:#0C3274;">1 (BOOTREQUEST)</tspan>   XID: <tspan class="field-val" style="fill:#0C3274;">0x3F2A91</tspan>   yiaddr: <tspan class="field-val" style="fill:#0C3274;">0.0.0.0</tspan></text>

<text x="16" y="502" class="lbl-sm" style="font-style:italic;">*Schematic layout - not a live screenshot. Header values shown are examples; open this window via the envelope icon on any packet in Simulation Mode.</text>
</svg>
