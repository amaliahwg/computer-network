<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arp-title">
<title id="arp-title">Diagram of an ARP broadcast and reply happening before an ICMP echo request</title>
<style>
  .lbl { font-family: system-ui, -apple-system, sans-serif; fill: #1A1A1A; font-size: 13px; }
  .lbl-sm { font-family: system-ui, -apple-system, sans-serif; fill: #5B6B78; font-size: 12px; }
  .lbl-w { font-family: system-ui, -apple-system, sans-serif; fill: #ffffff; font-size: 12px; font-weight: 600; }
  .lbl-title { font-family: system-ui, -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 600; }
  .dev { fill: #0C3274; }
  .devg { fill: #B7C2CB; }
</style>

<rect x="4" y="4" width="892" height="452" rx="10" fill="#ffffff" stroke="#0C3274" stroke-width="2"/>
<rect x="4" y="4" width="892" height="32" rx="10" fill="#0C3274"/>
<rect x="4" y="20" width="892" height="16" fill="#0C3274"/>
<text x="20" y="25" class="lbl-title">LAN 1 — why ARP always happens before ICMP</text>

<rect x="24" y="50" width="852" height="330" rx="8" fill="#F6F8FA" stroke="#D7E1E8"/>
<text x="40" y="72" class="lbl-sm" style="font-weight:600;">LAN 1 (same subnet, one switch)</text>

<!-- devices -->
<rect x="60" y="180" width="40" height="30" rx="4" class="dev"/>
<text x="80" y="226" text-anchor="middle" class="lbl-sm">PC0</text>
<rect x="420" y="180" width="40" height="30" rx="4" class="dev"/>
<text x="440" y="226" text-anchor="middle" class="lbl-sm">PC1</text>
<rect x="780" y="180" width="40" height="30" rx="4" class="devg"/>
<text x="800" y="226" text-anchor="middle" class="lbl-sm">Router0</text>
<rect x="240" y="150" width="50" height="24" rx="3" fill="#5B6B78"/>
<text x="265" y="167" text-anchor="middle" class="lbl-w" style="font-size:10px;">Switch0</text>

<!-- step 1: broadcast -->
<line x1="100" y1="195" x2="260" y2="160" stroke="#E8792A" stroke-width="2" stroke-dasharray="5 3"/>
<line x1="290" y1="160" x2="440" y2="195" stroke="#E8792A" stroke-width="2" stroke-dasharray="5 3"/>
<line x1="290" y1="160" x2="800" y2="195" stroke="#E8792A" stroke-width="2" stroke-dasharray="5 3"/>
<text x="260" y="110" text-anchor="middle" class="lbl" style="fill:#E8792A;font-weight:700;">① ARP request (broadcast): "who has 192.168.1.20?"</text>
<text x="260" y="130" text-anchor="middle" class="lbl-sm">Every device on LAN 1 receives it — including Router0.</text>

<!-- step 2: reply -->
<line x1="440" y1="210" x2="100" y2="255" stroke="#00A79E" stroke-width="2.5"/>
<text x="260" y="252" text-anchor="middle" class="lbl" style="fill:#00A79E;font-weight:700;">② ARP reply (unicast): "192.168.1.20 is at MAC 00:1A:…"</text>
<text x="260" y="272" text-anchor="middle" class="lbl-sm">Only the device that owns the IP replies.</text>

<!-- step 3: icmp -->
<line x1="100" y1="290" x2="420" y2="290" stroke="#145DA0" stroke-width="3"/>
<text x="260" y="308" text-anchor="middle" class="lbl" style="fill:#145DA0;font-weight:700;">③ ICMP Echo Request — the "ping" message</text>
<text x="260" y="324" text-anchor="middle" class="lbl-sm">Sent now that PC0 knows PC1's MAC address.</text>

<text x="800" y="255" text-anchor="middle" class="lbl-sm" style="font-style:italic;">Routers don't forward</text>
<text x="800" y="271" text-anchor="middle" class="lbl-sm" style="font-style:italic;">broadcasts — this ARP</text>
<text x="800" y="287" text-anchor="middle" class="lbl-sm" style="font-style:italic;">request stops here.</text>

<!-- legend -->
<line x1="60" y1="356" x2="100" y2="356" stroke="#E8792A" stroke-width="2" stroke-dasharray="5 3"/>
<text x="108" y="360" class="lbl-sm">Broadcast</text>
<line x1="230" y1="356" x2="270" y2="356" stroke="#00A79E" stroke-width="2.5"/>
<text x="278" y="360" class="lbl-sm">Unicast reply</text>
<line x1="420" y1="356" x2="460" y2="356" stroke="#145DA0" stroke-width="3"/>
<text x="468" y="360" class="lbl-sm">ICMP request</text>

<text x="24" y="404" class="lbl-sm" style="font-style:italic;">Schematic — packet timing simplified for teaching.</text>
</svg>
