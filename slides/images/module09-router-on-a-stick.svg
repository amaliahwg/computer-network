<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rots-title">
<title id="rots-title">Diagram of router-on-a-stick: one physical interface with per-VLAN sub-interfaces over a trunk link</title>
<style>
  .lbl { font-family: system-ui, -apple-system, sans-serif; fill: #1A1A1A; font-size: 13px; }
  .lbl-sm { font-family: system-ui, -apple-system, sans-serif; fill: #5B6B78; font-size: 12px; }
  .lbl-w { font-family: system-ui, -apple-system, sans-serif; fill: #ffffff; font-size: 13px; font-weight: 600; }
  .lbl-title { font-family: system-ui, -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 600; }
</style>

<rect x="4" y="4" width="892" height="472" rx="10" fill="#ffffff" stroke="#0C3274" stroke-width="2"/>
<rect x="4" y="4" width="892" height="32" rx="10" fill="#0C3274"/>
<rect x="4" y="20" width="892" height="16" fill="#0C3274"/>
<text x="20" y="25" class="lbl-title">Router-on-a-stick — one physical interface, two logical gateways</text>

<!-- sub-interface chips -->
<rect x="120" y="60" width="230" height="56" rx="8" fill="#145DA0"/>
<text x="235" y="82" text-anchor="middle" class="lbl-w">Fa0/0.10 — VLAN 10</text>
<text x="235" y="102" text-anchor="middle" class="lbl-sm" style="fill:#E3F3F1;">Gateway 192.168.10.1</text>

<rect x="550" y="60" width="230" height="56" rx="8" fill="#E8792A"/>
<text x="665" y="82" text-anchor="middle" class="lbl-w">Fa0/0.20 — VLAN 20</text>
<text x="665" y="102" text-anchor="middle" class="lbl-sm" style="fill:#FFF8F1;">Gateway 192.168.20.1</text>

<!-- dashed lines from sub-interfaces to single physical router box, showing they are logical divisions of one port -->
<line x1="235" y1="116" x2="410" y2="160" stroke="#145DA0" stroke-width="2" stroke-dasharray="5 3"/>
<line x1="665" y1="116" x2="490" y2="160" stroke="#E8792A" stroke-width="2" stroke-dasharray="5 3"/>

<!-- router -->
<rect x="380" y="160" width="140" height="60" rx="8" fill="#0C3274"/>
<text x="450" y="184" text-anchor="middle" class="lbl-w">R0</text>
<text x="450" y="202" text-anchor="middle" class="lbl-sm" style="fill:#D7E1E8;">one physical Fa0/0</text>

<!-- trunk link -->
<line x1="450" y1="220" x2="450" y2="290" stroke="#0C3274" stroke-width="4"/>
<text x="470" y="260" class="lbl-sm" style="font-weight:600;">Trunk (802.1Q) — carries tagged</text>
<text x="470" y="276" class="lbl-sm" style="font-weight:600;">frames for VLAN 10 and VLAN 20</text>

<!-- switch -->
<rect x="300" y="290" width="300" height="50" rx="8" fill="#5B6B78"/>
<text x="450" y="320" text-anchor="middle" class="lbl-w">SW0</text>

<!-- access lines to PCs -->
<line x1="360" y1="340" x2="140" y2="400" stroke="#145DA0" stroke-width="2"/>
<line x1="400" y1="340" x2="280" y2="400" stroke="#145DA0" stroke-width="2"/>
<line x1="500" y1="340" x2="620" y2="400" stroke="#E8792A" stroke-width="2"/>
<line x1="540" y1="340" x2="760" y2="400" stroke="#E8792A" stroke-width="2"/>

<!-- PCs -->
<rect x="120" y="400" width="40" height="30" rx="4" fill="#145DA0"/>
<text x="140" y="446" text-anchor="middle" class="lbl-sm">VLAN 10 PC</text>
<rect x="260" y="400" width="40" height="30" rx="4" fill="#145DA0"/>
<text x="280" y="446" text-anchor="middle" class="lbl-sm">VLAN 10 PC</text>
<rect x="600" y="400" width="40" height="30" rx="4" fill="#E8792A"/>
<text x="620" y="446" text-anchor="middle" class="lbl-sm">VLAN 20 PC</text>
<rect x="740" y="400" width="40" height="30" rx="4" fill="#E8792A"/>
<text x="760" y="446" text-anchor="middle" class="lbl-sm">VLAN 20 PC</text>

<text x="24" y="464" class="lbl-sm" style="font-style:italic;">Schematic — each sub-interface is a logical division of one physical port, not a separate cable.</text>
</svg>
