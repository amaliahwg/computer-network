<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dv-title">
<title id="dv-title">Diagram of R0's routing table with RIP: first learning round, then a silent failure of the path through R1, then recovery through R2</title>
<style>
  .lt { font-family: system-ui, -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 600; }
  .lw { font-family: system-ui, -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 700; }
  .m { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 11.5px; fill: #1A1A1A; }
  .mn { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 11.5px; fill: #C2620F; font-weight: 700; }
  .mb { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 11.5px; fill: #B3261E; font-weight: 700; }
  .md { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 11.5px; fill: #8A97A2; }
  .it { font-family: system-ui, -apple-system, sans-serif; fill: #5B6B78; font-size: 12px; font-style: italic; }
  .sm { font-family: system-ui, -apple-system, sans-serif; fill: #5B6B78; font-size: 12px; }
  .panel { fill: #FAFBFC; stroke: #D7E1E8; stroke-width: 1.5; }
</style>
<rect x="4" y="4" width="892" height="532" rx="10" fill="#ffffff" stroke="#0C3274" stroke-width="2"/>
<rect x="4" y="4" width="892" height="32" rx="10" fill="#0C3274"/>
<rect x="4" y="20" width="892" height="16" fill="#0C3274"/>
<text x="20" y="25" class="lt">RIP at R0 - learning the network, then losing and recovering the path through R1</text>
<rect x="20" y="50" width="430" height="206" rx="8" class="panel"/>
<rect x="28" y="58" width="414" height="26" rx="4" fill="#0C3274"/>
<text x="235.0" y="76" text-anchor="middle" class="lw">1. t0 - RIP just enabled on R0</text>
<text x="38" y="106" class="m" xml:space="preserve">C 192.168.1.0/24  (LAN 1)</text>
<text x="38" y="125" class="m" xml:space="preserve">C 10.0.1.0/30  (to R1)</text>
<text x="38" y="144" class="m" xml:space="preserve">C 10.0.3.0/30  (to R2)</text>
<text x="38" y="169" class="it">R0 knows only its own three connected networks.</text>
<rect x="450" y="50" width="430" height="206" rx="8" class="panel"/>
<rect x="458" y="58" width="414" height="26" rx="4" fill="#0C3274"/>
<text x="665.0" y="76" text-anchor="middle" class="lw">2. t1 - after the first update exchange (about 30 s)</text>
<text x="468" y="106" class="m" xml:space="preserve">C 192.168.1.0/24  (LAN 1)</text>
<text x="468" y="125" class="m" xml:space="preserve">C 10.0.1.0/30  (to R1)</text>
<text x="468" y="144" class="m" xml:space="preserve">C 10.0.3.0/30  (to R2)</text>
<text x="468" y="163" class="mn" xml:space="preserve">+ R 192.168.3.0/24 [120/1] via R1 (10.0.1.2)</text>
<text x="468" y="182" class="mn" xml:space="preserve">+ R 192.168.2.0/24 [120/1] via R2 (10.0.3.2)</text>
<text x="468" y="201" class="mn" xml:space="preserve">+ R 10.0.2.0/30 [120/1] via R1 and via R2</text>
<text x="468" y="226" class="it">In a triangle every router neighbors the other two,</text>
<text x="468" y="242" class="it">so one round teaches everything.</text>
<rect x="20" y="268" width="430" height="230" rx="8" class="panel"/>
<rect x="28" y="276" width="414" height="26" rx="4" fill="#B3261E"/>
<text x="235.0" y="294" text-anchor="middle" class="lw">3. Failure - R1 stops answering on the R0-R1 link</text>
<text x="38" y="324" class="m" xml:space="preserve">C 192.168.1.0/24</text>
<text x="38" y="343" class="m" xml:space="preserve">C 10.0.1.0/30   (R0 side still up)</text>
<text x="38" y="362" class="m" xml:space="preserve">C 10.0.3.0/30</text>
<text x="38" y="381" class="mb" xml:space="preserve">R 192.168.3.0/24 [120/1] via R1 (10.0.1.2)</text>
<text x="38" y="400" class="md" xml:space="preserve">     age keeps growing: no updates arrive from R1</text>
<text x="38" y="419" class="m" xml:space="preserve">R 192.168.2.0/24 [120/1] via R2 (10.0.3.2)</text>
<text x="38" y="444" class="it">R0 cannot see the far end die, so it keeps the stale route.</text>
<text x="38" y="460" class="it">PC0 to PC1 pings time out (black hole) until the timers run out.</text>
<rect x="450" y="268" width="430" height="230" rx="8" class="panel"/>
<rect x="458" y="276" width="414" height="26" rx="4" fill="#00A79E"/>
<text x="665.0" y="294" text-anchor="middle" class="lw">4. After about 180 s invalid, 240 s flushed</text>
<text x="468" y="324" class="m" xml:space="preserve">C 192.168.1.0/24</text>
<text x="468" y="343" class="m" xml:space="preserve">C 10.0.1.0/30</text>
<text x="468" y="362" class="m" xml:space="preserve">C 10.0.3.0/30</text>
<text x="468" y="381" class="mn" xml:space="preserve">R 192.168.3.0/24 [120/2] via R2 (10.0.3.2)</text>
<text x="468" y="400" class="m" xml:space="preserve">R 192.168.2.0/24 [120/1] via R2 (10.0.3.2)</text>
<text x="468" y="425" class="it">Stale route removed; R2 already offered a 2-hop path.</text>
<text x="468" y="441" class="it">Pings succeed again, via R2. Exact timing varies.</text>
<text x="20" y="522" class="sm" style="font-style:italic;">Schematic - orange entries are newly learned, red is the stale route; ages and timing are approximate.</text>
</svg>
