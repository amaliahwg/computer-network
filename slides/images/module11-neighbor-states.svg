<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="states-title">
<title id="states-title">Diagram of the OSPF neighbor adjacency state ladder from Down to Full</title>
<style>
  .lbl { font-family: system-ui, -apple-system, sans-serif; fill: #1A1A1A; font-size: 13px; }
  .lbl-sm { font-family: system-ui, -apple-system, sans-serif; fill: #5B6B78; font-size: 10.5px; }
  .lbl-w { font-family: system-ui, -apple-system, sans-serif; fill: #ffffff; font-size: 13px; font-weight: 700; }
  .lbl-title { font-family: system-ui, -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 600; }
</style>
<defs>
  <marker id="stateArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5B6B78"/>
  </marker>
</defs>

<rect x="4" y="4" width="892" height="332" rx="10" fill="#ffffff" stroke="#0C3274" stroke-width="2"/>
<rect x="4" y="4" width="892" height="32" rx="10" fill="#0C3274"/>
<rect x="4" y="20" width="892" height="16" fill="#0C3274"/>
<text x="20" y="25" class="lbl-title">OSPF neighbor adjacency — the state ladder from Down to Full</text>

<!-- 7 boxes -->
<!-- Down -->
<rect x="24" y="70" width="96" height="50" rx="6" fill="#B7C2CB"/>
<text x="72" y="100" text-anchor="middle" class="lbl-w" style="fill:#1A1A1A;">Down</text>
<text x="72" y="136" text-anchor="middle" class="lbl-sm">no Hello seen</text>

<line x1="120" y1="95" x2="144" y2="95" stroke="#5B6B78" stroke-width="2" marker-end="url(#stateArrow)"/>

<!-- Init -->
<rect x="144" y="70" width="96" height="50" rx="6" fill="#145DA0"/>
<text x="192" y="100" text-anchor="middle" class="lbl-w">Init</text>
<text x="192" y="136" text-anchor="middle" class="lbl-sm">Hello seen, one-way</text>

<line x1="240" y1="95" x2="264" y2="95" stroke="#5B6B78" stroke-width="2" marker-end="url(#stateArrow)"/>

<!-- 2-Way -->
<rect x="264" y="70" width="96" height="50" rx="6" fill="#145DA0"/>
<text x="312" y="100" text-anchor="middle" class="lbl-w">2-Way</text>
<text x="312" y="136" text-anchor="middle" class="lbl-sm">bidirectional Hello</text>

<line x1="360" y1="95" x2="384" y2="95" stroke="#5B6B78" stroke-width="2" marker-end="url(#stateArrow)"/>

<!-- ExStart -->
<rect x="384" y="70" width="96" height="50" rx="6" fill="#145DA0"/>
<text x="432" y="100" text-anchor="middle" class="lbl-w">ExStart</text>
<text x="432" y="136" text-anchor="middle" class="lbl-sm">master/slave chosen</text>

<line x1="480" y1="95" x2="504" y2="95" stroke="#5B6B78" stroke-width="2" marker-end="url(#stateArrow)"/>

<!-- Exchange -->
<rect x="504" y="70" width="96" height="50" rx="6" fill="#145DA0"/>
<text x="552" y="100" text-anchor="middle" class="lbl-w">Exchange</text>
<text x="552" y="136" text-anchor="middle" class="lbl-sm">DBD summaries swap</text>

<line x1="600" y1="95" x2="624" y2="95" stroke="#5B6B78" stroke-width="2" marker-end="url(#stateArrow)"/>

<!-- Loading -->
<rect x="624" y="70" width="96" height="50" rx="6" fill="#145DA0"/>
<text x="672" y="100" text-anchor="middle" class="lbl-w">Loading</text>
<text x="672" y="136" text-anchor="middle" class="lbl-sm">missing LSAs requested</text>

<line x1="720" y1="95" x2="744" y2="95" stroke="#5B6B78" stroke-width="2" marker-end="url(#stateArrow)"/>

<!-- Full -->
<rect x="744" y="62" width="130" height="66" rx="8" fill="#E8792A" stroke="#0C3274" stroke-width="2"/>
<text x="809" y="98" text-anchor="middle" class="lbl-w" style="font-size:16px;">FULL</text>
<text x="809" y="180" text-anchor="middle" class="lbl-sm" style="font-weight:700;fill:#E8792A;">goal state —</text>
<text x="809" y="194" text-anchor="middle" class="lbl-sm" style="font-weight:700;fill:#E8792A;">LSDBs synchronized</text>

<rect x="24" y="220" width="850" height="60" rx="8" fill="#F6F8FA" stroke="#D7E1E8"/>
<text x="40" y="244" class="lbl-sm" style="font-size:13px;">A neighbor stuck below FULL never contributes routes — mismatched area IDs or timers are the</text>
<text x="40" y="264" class="lbl-sm" style="font-size:13px;">most common reason two routers stall at 2-Way or ExStart and never progress further.</text>

<text x="24" y="312" class="lbl-sm" style="font-style:italic;font-size:12px;">Schematic — timing between states varies; the sequence itself is fixed.</text>
</svg>
