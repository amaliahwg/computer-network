<rect x="4" y="4" width="892" height="206" rx="10" fill="#ffffff" stroke="#0C3274" stroke-width="2"/>
<rect x="4" y="4" width="892" height="32" rx="10" fill="#0C3274"/>
<rect x="4" y="20" width="892" height="16" fill="#0C3274"/>
<text x="20" y="25" class="lbl-title">R0 - CLI (Step 10: show ip eigrp neighbors)</text>
<rect x="16" y="44" width="868" height="126" rx="6" fill="#0C3274" stroke="#00A79E" stroke-width="1.5"/>
<text x="30" y="66" class="term" xml:space="preserve"><tspan class="term-hi">R0#</tspan> show ip eigrp neighbors</text>
<text x="30" y="84" class="term" xml:space="preserve">EIGRP-IPv4 Neighbors for AS(100)</text>
<text x="30" y="102" class="term" xml:space="preserve">H   Address         Interface    Hold Uptime   SRTT   RTO  Q  Seq</text>
<text x="30" y="120" class="term" xml:space="preserve">                                 (sec)         (ms)       Cnt Num</text>
<text x="30" y="138" class="term" xml:space="preserve">1   10.0.3.2        Gi0/2          13 00:03:41   40   1000  0  7</text>
<text x="30" y="156" class="term" xml:space="preserve">0   10.0.1.2        Gi0/1          12 00:03:45   40   1000  0  9</text>
<text x="16" y="194" class="lbl-sm" style="font-style:italic;">*Schematic layout - not a live screenshot. Hold counts down from 15 and resets at every hello (5 s). Wording of the header varies by IOS version.</text>
