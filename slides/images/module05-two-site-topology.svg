<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="topo5-title">
<title id="topo5-title">Diagram of the Module 5 two-site topology: Seoul LAN and Busan LAN joined by a WAN link between two routers</title>
<style>
  .lbl { font-family: system-ui, -apple-system, sans-serif; fill: #1A1A1A; font-size: 13px; }
  .lbl-sm { font-family: system-ui, -apple-system, sans-serif; fill: #5B6B78; font-size: 11px; }
  .lbl-w { font-family: system-ui, -apple-system, sans-serif; fill: #ffffff; font-size: 13px; font-weight: 600; }
  .lbl-title { font-family: system-ui, -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 600; }
  .dev { fill: #0C3274; }
</style>

<rect x="4" y="4" width="892" height="452" rx="10" fill="#ffffff" stroke="#0C3274" stroke-width="2"/>
<rect x="4" y="4" width="892" height="32" rx="10" fill="#0C3274"/>
<rect x="4" y="20" width="892" height="16" fill="#0C3274"/>
<text x="20" y="25" class="lbl-title">Two-site topology - Seoul (LAN A) and Busan (LAN B) joined by a WAN link</text>

<!-- Left LAN box: Seoul -->
<rect x="24" y="56" width="246" height="330" rx="8" fill="#E3F3F1" stroke="#00A79E"/>
<text x="147" y="78" text-anchor="middle" class="lbl" style="font-weight:700;fill:#0C3274;">Site A - Seoul · 192.168.1.0/24</text>

<rect x="50" y="110" width="70" height="32" rx="4" class="dev"/>
<text x="85" y="130" text-anchor="middle" class="lbl-w" style="font-size:11px;">PC0</text>
<text x="85" y="160" text-anchor="middle" class="lbl-sm">192.168.1.10 /24</text>
<text x="85" y="174" text-anchor="middle" class="lbl-sm">GW 192.168.1.1</text>

<rect x="140" y="230" width="80" height="28" rx="4" fill="#5B6B78"/>
<text x="180" y="248" text-anchor="middle" class="lbl-w" style="font-size:11px;">SW0</text>
<line x1="85" y1="142" x2="180" y2="230" stroke="#D7E1E8" stroke-width="2"/>

<!-- R0 router -->
<rect x="300" y="205" width="90" height="50" rx="6" class="dev"/>
<text x="345" y="235" text-anchor="middle" class="lbl-w">R0</text>
<line x1="220" y1="244" x2="300" y2="230" stroke="#D7E1E8" stroke-width="2"/>
<text x="345" y="195" text-anchor="middle" class="lbl-sm" style="font-weight:600;">Fa0/0 = 192.168.1.1/24</text>
<text x="345" y="278" text-anchor="middle" class="lbl-sm" style="font-weight:600;">Fa0/1 = 10.0.0.1/30</text>

<!-- WAN link -->
<line x1="390" y1="230" x2="510" y2="230" stroke="#E8792A" stroke-width="3"/>
<text x="450" y="212" text-anchor="middle" class="lbl" style="fill:#E8792A;font-weight:700;">WAN - 10.0.0.0/30</text>

<!-- R1 router -->
<rect x="510" y="205" width="90" height="50" rx="6" class="dev"/>
<text x="555" y="235" text-anchor="middle" class="lbl-w">R1</text>
<text x="555" y="195" text-anchor="middle" class="lbl-sm" style="font-weight:600;">Fa0/1 = 10.0.0.2/30</text>
<text x="555" y="278" text-anchor="middle" class="lbl-sm" style="font-weight:600;">Fa0/0 = 192.168.2.1/24</text>

<line x1="600" y1="230" x2="690" y2="244" stroke="#D7E1E8" stroke-width="2"/>
<rect x="650" y="230" width="80" height="28" rx="4" fill="#5B6B78"/>
<text x="690" y="248" text-anchor="middle" class="lbl-w" style="font-size:11px;">SW1</text>

<!-- Right LAN box: Busan -->
<rect x="630" y="56" width="246" height="330" rx="8" fill="#E3F3F1" stroke="#00A79E"/>
<text x="753" y="78" text-anchor="middle" class="lbl" style="font-weight:700;fill:#0C3274;">Site B - Busan · 192.168.2.0/24</text>

<rect x="770" y="110" width="70" height="32" rx="4" class="dev"/>
<text x="805" y="130" text-anchor="middle" class="lbl-w" style="font-size:11px;">PC1</text>
<text x="805" y="160" text-anchor="middle" class="lbl-sm">192.168.2.10 /24</text>
<text x="805" y="174" text-anchor="middle" class="lbl-sm">GW 192.168.2.1</text>
<line x1="805" y1="142" x2="690" y2="230" stroke="#D7E1E8" stroke-width="2"/>

<text x="345" y="330" text-anchor="middle" class="lbl-sm" style="font-style:italic;">No route to the other</text>
<text x="345" y="344" text-anchor="middle" class="lbl-sm" style="font-style:italic;">site's LAN - yet.</text>
<text x="555" y="330" text-anchor="middle" class="lbl-sm" style="font-style:italic;">Each router only knows</text>
<text x="555" y="344" text-anchor="middle" class="lbl-sm" style="font-style:italic;">its own connected networks.</text>

<text x="24" y="410" class="lbl-sm" style="font-style:italic;">Schematic - not to scale. WAN link 10.0.0.0/30 is a point-to-point link between R0 and R1.</text>
</svg>
