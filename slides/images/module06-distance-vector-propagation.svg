<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dv-title">
<title id="dv-title">Diagram of RIP distance-vector convergence across three routers over three time steps</title>
<style>
  .lbl { font-family: system-ui, -apple-system, sans-serif; fill: #1A1A1A; font-size: 12px; }
  .lbl-sm { font-family: system-ui, -apple-system, sans-serif; fill: #5B6B78; font-size: 11px; }
  .lbl-new { font-family: system-ui, -apple-system, sans-serif; fill: #C2620F; font-size: 11px; font-weight: 700; }
  .lbl-w { font-family: system-ui, -apple-system, sans-serif; fill: #ffffff; font-size: 14px; font-weight: 700; }
  .lbl-title { font-family: system-ui, -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 600; }
  .stepbar { font-family: system-ui, -apple-system, sans-serif; fill: #0C3274; font-size: 12px; font-weight: 700; }
  .mono { font-family: monospace; }
  .panel { fill: #FAFBFC; stroke: #D7E1E8; stroke-width: 1.5; }
  .block { fill: #ffffff; stroke: #E3F3F1; stroke-width: 1; }
</style>

<rect x="4" y="4" width="892" height="512" rx="10" fill="#ffffff" stroke="#0C3274" stroke-width="2"/>
<rect x="4" y="4" width="892" height="32" rx="10" fill="#0C3274"/>
<rect x="4" y="20" width="892" height="16" fill="#0C3274"/>
<text x="20" y="25" class="lbl-title">RIP convergence - routing-table state at R0, R1, R2 over three update rounds</text>

<!-- chain hint -->
<text x="450" y="50" text-anchor="middle" class="lbl-sm">Topology: PC0 – R0 – R1 – R2 – PC2, with PC1 on a LAN directly off R1</text>

<!-- Panel 1: R0 -->
<rect x="24" y="60" width="272" height="440" rx="8" class="panel"/>
<rect x="32" y="68" width="256" height="28" rx="4" fill="#0C3274"/>
<text x="160" y="87" text-anchor="middle" class="lbl-w">R0</text>

<text x="42" y="116" class="stepbar">t0 - start</text>
<rect x="42" y="122" width="238" height="40" rx="4" class="block"/>
<text x="50" y="138" class="lbl-sm mono">C 192.168.1.0/24</text>
<text x="50" y="154" class="lbl-sm mono">C 10.1.0.0/30</text>

<text x="42" y="182" class="stepbar">t1 - after 1st exchange</text>
<rect x="42" y="188" width="238" height="72" rx="4" class="block"/>
<text x="50" y="204" class="lbl-sm mono">C 192.168.1.0/24</text>
<text x="50" y="220" class="lbl-sm mono">C 10.1.0.0/30</text>
<text x="50" y="236" class="lbl-new mono">+ R 10.2.0.0/30 [1 hop]</text>
<text x="50" y="252" class="lbl-new mono">+ R 192.168.3.0/24 [1 hop]</text>

<text x="42" y="280" class="stepbar">t2 - converged</text>
<rect x="42" y="286" width="238" height="88" rx="4" class="block"/>
<text x="50" y="302" class="lbl-sm mono">C 192.168.1.0/24</text>
<text x="50" y="318" class="lbl-sm mono">C 10.1.0.0/30</text>
<text x="50" y="334" class="lbl-sm mono">R 10.2.0.0/30 [1 hop]</text>
<text x="50" y="350" class="lbl-sm mono">R 192.168.3.0/24 [1 hop]</text>
<text x="50" y="366" class="lbl-new mono">+ R 192.168.2.0/24 [2 hops]</text>

<text x="42" y="400" class="lbl-sm" style="font-style:italic;">Needs 2 rounds to learn</text>
<text x="42" y="415" class="lbl-sm" style="font-style:italic;">PC2's LAN, on the far</text>
<text x="42" y="430" class="lbl-sm" style="font-style:italic;">side of R1.</text>

<!-- Panel 2: R1 -->
<rect x="314" y="60" width="272" height="440" rx="8" class="panel"/>
<rect x="322" y="68" width="256" height="28" rx="4" fill="#0C3274"/>
<text x="450" y="87" text-anchor="middle" class="lbl-w">R1</text>

<text x="332" y="116" class="stepbar">t0 - start</text>
<rect x="332" y="122" width="238" height="56" rx="4" class="block"/>
<text x="340" y="138" class="lbl-sm mono">C 10.1.0.0/30</text>
<text x="340" y="154" class="lbl-sm mono">C 10.2.0.0/30</text>
<text x="340" y="170" class="lbl-sm mono">C 192.168.3.0/24</text>

<text x="332" y="198" class="stepbar">t1 - after 1st exchange</text>
<rect x="332" y="204" width="238" height="88" rx="4" class="block"/>
<text x="340" y="220" class="lbl-sm mono">C 10.1.0.0/30</text>
<text x="340" y="236" class="lbl-sm mono">C 10.2.0.0/30</text>
<text x="340" y="252" class="lbl-sm mono">C 192.168.3.0/24</text>
<text x="340" y="268" class="lbl-new mono">+ R 192.168.1.0/24 [1 hop]</text>
<text x="340" y="284" class="lbl-new mono">+ R 192.168.2.0/24 [1 hop]</text>

<text x="332" y="312" class="stepbar">t2 - converged</text>
<rect x="332" y="318" width="238" height="56" rx="4" class="block"/>
<text x="340" y="338" class="lbl-sm" style="font-style:italic;">No new routes -</text>
<text x="340" y="354" class="lbl-sm" style="font-style:italic;">R1 already knows every</text>
<text x="340" y="368" class="lbl-sm" style="font-style:italic;">network after t1.</text>

<text x="332" y="400" class="lbl" style="font-weight:700;fill:#00A79E;">R1 converges first -</text>
<text x="332" y="416" class="lbl-sm">it is directly adjacent</text>
<text x="332" y="430" class="lbl-sm">to both R0 and R2.</text>

<!-- Panel 3: R2 -->
<rect x="604" y="60" width="272" height="440" rx="8" class="panel"/>
<rect x="612" y="68" width="256" height="28" rx="4" fill="#0C3274"/>
<text x="740" y="87" text-anchor="middle" class="lbl-w">R2</text>

<text x="622" y="116" class="stepbar">t0 - start</text>
<rect x="622" y="122" width="238" height="40" rx="4" class="block"/>
<text x="630" y="138" class="lbl-sm mono">C 10.2.0.0/30</text>
<text x="630" y="154" class="lbl-sm mono">C 192.168.2.0/24</text>

<text x="622" y="182" class="stepbar">t1 - after 1st exchange</text>
<rect x="622" y="188" width="238" height="72" rx="4" class="block"/>
<text x="630" y="204" class="lbl-sm mono">C 10.2.0.0/30</text>
<text x="630" y="220" class="lbl-sm mono">C 192.168.2.0/24</text>
<text x="630" y="236" class="lbl-new mono">+ R 10.1.0.0/30 [1 hop]</text>
<text x="630" y="252" class="lbl-new mono">+ R 192.168.3.0/24 [1 hop]</text>

<text x="622" y="280" class="stepbar">t2 - converged</text>
<rect x="622" y="286" width="238" height="88" rx="4" class="block"/>
<text x="630" y="302" class="lbl-sm mono">C 10.2.0.0/30</text>
<text x="630" y="318" class="lbl-sm mono">C 192.168.2.0/24</text>
<text x="630" y="334" class="lbl-sm mono">R 10.1.0.0/30 [1 hop]</text>
<text x="630" y="350" class="lbl-sm mono">R 192.168.3.0/24 [1 hop]</text>
<text x="630" y="366" class="lbl-new mono">+ R 192.168.1.0/24 [2 hops]</text>

<text x="622" y="400" class="lbl-sm" style="font-style:italic;">Needs 2 rounds to learn</text>
<text x="622" y="415" class="lbl-sm" style="font-style:italic;">PC0's LAN, on the far</text>
<text x="622" y="430" class="lbl-sm" style="font-style:italic;">side of R1.</text>

<text x="24" y="478" class="lbl-sm" style="font-style:italic;">Schematic - gold entries are the routes each router just learned that round; RIP's 30-second periodic update drives each round.</text>
</svg>
