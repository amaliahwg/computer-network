<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pt-pinout-title">
<title id="pt-pinout-title">RJ-45 pinout reference diagram comparing T-568A and T-568B wire color order</title>
<style>
  .lbl { font-family: system-ui, -apple-system, sans-serif; fill: #1A1A1A; }
  .lbl-sm { font-family: system-ui, -apple-system, sans-serif; fill: #5B6B78; font-size: 12px; }
  .lbl-title { font-family: system-ui, -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 600; }
  .panel { fill: #ffffff; stroke: #D7E1E8; stroke-width: 1.5; }
  .panel-ghost { fill: #F6F8FA; stroke: #D7E1E8; stroke-width: 1.5; stroke-dasharray: 5 4; opacity: 0.85; }
  .mono { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 12.5px; fill: #0C3274; font-weight: 600; }
  .swatch { stroke: #B8C4CC; stroke-width: 1; }
</style>

<!-- window frame -->
<rect x="4" y="4" width="892" height="492" rx="10" fill="#ffffff" stroke="#0C3274" stroke-width="2"/>

<!-- title bar -->
<rect x="4" y="4" width="892" height="32" rx="10" fill="#0C3274"/>
<rect x="4" y="20" width="892" height="16" fill="#0C3274"/>
<text x="20" y="25" class="lbl-title">RJ-45 Pinout Reference: T-568A vs T-568B</text>
<circle cx="850" cy="20" r="5" fill="#00A79E"/>
<circle cx="868" cy="20" r="5" fill="#E3F3F1"/>

<!-- ===== Panel A: T-568A ===== -->
<rect x="16" y="48" width="420" height="420" rx="6" class="panel"/>
<text x="32" y="72" class="lbl" style="font-size:14px;font-weight:600;">T-568A</text>

<rect x="32" y="84" width="130" height="30" rx="4" class="panel-ghost"/>
<text x="97" y="103" text-anchor="middle" class="lbl-sm" style="font-weight:600;fill:#0C3274;">RJ-45 connector</text>
<text x="32" y="128" class="lbl-sm">Pins 1-8, left to right, clip facing down</text>

<!-- Pin 1: White/Green -->
<text x="32" y="156" class="mono">Pin 1</text>
<rect x="90" y="142" width="56" height="18" rx="2" fill="#ffffff" class="swatch"/>
<rect x="90" y="142" width="14" height="18" fill="#ffffff" class="swatch"/>
<rect x="104" y="142" width="14" height="18" fill="#2E7D32"/>
<rect x="118" y="142" width="14" height="18" fill="#ffffff" class="swatch"/>
<rect x="132" y="142" width="14" height="18" fill="#2E7D32"/>
<text x="160" y="156" class="lbl-sm">White/Green</text>

<!-- Pin 2: Green -->
<text x="32" y="190" class="mono">Pin 2</text>
<rect x="90" y="176" width="56" height="18" rx="2" fill="#2E7D32" class="swatch"/>
<text x="160" y="190" class="lbl-sm">Green</text>

<!-- Pin 3: White/Orange -->
<text x="32" y="224" class="mono">Pin 3</text>
<rect x="90" y="210" width="14" height="18" fill="#ffffff" class="swatch"/>
<rect x="104" y="210" width="14" height="18" fill="#E8600C"/>
<rect x="118" y="210" width="14" height="18" fill="#ffffff" class="swatch"/>
<rect x="132" y="210" width="14" height="18" fill="#E8600C"/>
<text x="160" y="224" class="lbl-sm">White/Orange</text>

<!-- Pin 4: Blue -->
<text x="32" y="258" class="mono">Pin 4</text>
<rect x="90" y="244" width="56" height="18" rx="2" fill="#2F5FAD" class="swatch"/>
<text x="160" y="258" class="lbl-sm">Blue</text>

<!-- Pin 5: White/Blue -->
<text x="32" y="292" class="mono">Pin 5</text>
<rect x="90" y="278" width="14" height="18" fill="#ffffff" class="swatch"/>
<rect x="104" y="278" width="14" height="18" fill="#2F5FAD"/>
<rect x="118" y="278" width="14" height="18" fill="#ffffff" class="swatch"/>
<rect x="132" y="278" width="14" height="18" fill="#2F5FAD"/>
<text x="160" y="292" class="lbl-sm">White/Blue</text>

<!-- Pin 6: Orange -->
<text x="32" y="326" class="mono">Pin 6</text>
<rect x="90" y="312" width="56" height="18" rx="2" fill="#E8600C" class="swatch"/>
<text x="160" y="326" class="lbl-sm">Orange</text>

<!-- Pin 7: White/Brown -->
<text x="32" y="360" class="mono">Pin 7</text>
<rect x="90" y="346" width="14" height="18" fill="#ffffff" class="swatch"/>
<rect x="104" y="346" width="14" height="18" fill="#7B4B2A"/>
<rect x="118" y="346" width="14" height="18" fill="#ffffff" class="swatch"/>
<rect x="132" y="346" width="14" height="18" fill="#7B4B2A"/>
<text x="160" y="360" class="lbl-sm">White/Brown</text>

<!-- Pin 8: Brown -->
<text x="32" y="394" class="mono">Pin 8</text>
<rect x="90" y="380" width="56" height="18" rx="2" fill="#7B4B2A" class="swatch"/>
<text x="160" y="394" class="lbl-sm">Brown</text>

<!-- ===== Panel B: T-568B ===== -->
<rect x="464" y="48" width="420" height="420" rx="6" class="panel"/>
<text x="480" y="72" class="lbl" style="font-size:14px;font-weight:600;">T-568B</text>

<rect x="480" y="84" width="130" height="30" rx="4" class="panel-ghost"/>
<text x="545" y="103" text-anchor="middle" class="lbl-sm" style="font-weight:600;fill:#0C3274;">RJ-45 connector</text>
<text x="480" y="128" class="lbl-sm">Pins 1-8, left to right, clip facing down</text>

<!-- Pin 1: White/Orange -->
<text x="480" y="156" class="mono">Pin 1</text>
<rect x="538" y="142" width="14" height="18" fill="#ffffff" class="swatch"/>
<rect x="552" y="142" width="14" height="18" fill="#E8600C"/>
<rect x="566" y="142" width="14" height="18" fill="#ffffff" class="swatch"/>
<rect x="580" y="142" width="14" height="18" fill="#E8600C"/>
<text x="608" y="156" class="lbl-sm">White/Orange</text>

<!-- Pin 2: Orange -->
<text x="480" y="190" class="mono">Pin 2</text>
<rect x="538" y="176" width="56" height="18" rx="2" fill="#E8600C" class="swatch"/>
<text x="608" y="190" class="lbl-sm">Orange</text>

<!-- Pin 3: White/Green -->
<text x="480" y="224" class="mono">Pin 3</text>
<rect x="538" y="210" width="14" height="18" fill="#ffffff" class="swatch"/>
<rect x="552" y="210" width="14" height="18" fill="#2E7D32"/>
<rect x="566" y="210" width="14" height="18" fill="#ffffff" class="swatch"/>
<rect x="580" y="210" width="14" height="18" fill="#2E7D32"/>
<text x="608" y="224" class="lbl-sm">White/Green</text>

<!-- Pin 4: Blue -->
<text x="480" y="258" class="mono">Pin 4</text>
<rect x="538" y="244" width="56" height="18" rx="2" fill="#2F5FAD" class="swatch"/>
<text x="608" y="258" class="lbl-sm">Blue</text>

<!-- Pin 5: White/Blue -->
<text x="480" y="292" class="mono">Pin 5</text>
<rect x="538" y="278" width="14" height="18" fill="#ffffff" class="swatch"/>
<rect x="552" y="278" width="14" height="18" fill="#2F5FAD"/>
<rect x="566" y="278" width="14" height="18" fill="#ffffff" class="swatch"/>
<rect x="580" y="278" width="14" height="18" fill="#2F5FAD"/>
<text x="608" y="292" class="lbl-sm">White/Blue</text>

<!-- Pin 6: Green -->
<text x="480" y="326" class="mono">Pin 6</text>
<rect x="538" y="312" width="56" height="18" rx="2" fill="#2E7D32" class="swatch"/>
<text x="608" y="326" class="lbl-sm">Green</text>

<!-- Pin 7: White/Brown -->
<text x="480" y="360" class="mono">Pin 7</text>
<rect x="538" y="346" width="14" height="18" fill="#ffffff" class="swatch"/>
<rect x="552" y="346" width="14" height="18" fill="#7B4B2A"/>
<rect x="566" y="346" width="14" height="18" fill="#ffffff" class="swatch"/>
<rect x="580" y="346" width="14" height="18" fill="#7B4B2A"/>
<text x="608" y="360" class="lbl-sm">White/Brown</text>

<!-- Pin 8: Brown -->
<text x="480" y="394" class="mono">Pin 8</text>
<rect x="538" y="380" width="56" height="18" rx="2" fill="#7B4B2A" class="swatch"/>
<text x="608" y="394" class="lbl-sm">Brown</text>

<text x="16" y="478" class="lbl-sm">Straight-Through = same standard both ends (A-A or B-B). Crossover = A on one end, B on the other.</text>
<text x="16" y="494" class="lbl-sm" style="font-style:italic;">*Schematic layout - not a live photo. Wire colors follow the published TIA/EIA-568 standard exactly; connector shape is simplified.</text>
</svg>
