<svg viewBox="0 0 900 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pt-crossover-title">
<title id="pt-crossover-title">Pin-mapping diagram comparing straight-through, crossover, and rollover cable wiring</title>
<style>
  .lbl { font-family: system-ui, -apple-system, sans-serif; fill: #1A1A1A; }
  .lbl-sm { font-family: system-ui, -apple-system, sans-serif; fill: #5B6B78; font-size: 12px; }
  .lbl-title { font-family: system-ui, -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 600; }
  .panel { fill: #ffffff; stroke: #D7E1E8; stroke-width: 1.5; }
  .pin-num { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 11px; fill: #5B6B78; font-weight: 600; }
  .line-straight { stroke: #00A79E; stroke-width: 2; }
  .line-cross { stroke: #D64545; stroke-width: 2; }
  .line-roll { stroke: #7B4B9E; stroke-width: 2; }
</style>

<!-- window frame -->
<rect x="4" y="4" width="892" height="792" rx="10" fill="#ffffff" stroke="#0C3274" stroke-width="2"/>

<!-- title bar -->
<rect x="4" y="4" width="892" height="32" rx="10" fill="#0C3274"/>
<rect x="4" y="20" width="892" height="16" fill="#0C3274"/>
<text x="20" y="25" class="lbl-title">Cable Wiring: Straight-Through, Crossover, and Rollover</text>
<circle cx="850" cy="20" r="5" fill="#00A79E"/>
<circle cx="868" cy="20" r="5" fill="#E3F3F1"/>

<!-- ===== Panel 1: Straight-Through ===== -->
<rect x="16" y="48" width="868" height="216" rx="6" class="panel"/>
<text x="32" y="72" class="lbl" style="font-size:13px;font-weight:600;">STRAIGHT-THROUGH (same standard both ends - A-A or B-B)</text>
<text x="120" y="92" text-anchor="middle" class="lbl-sm" style="font-weight:600;">Connector A</text>
<text x="780" y="92" text-anchor="middle" class="lbl-sm" style="font-weight:600;">Connector B</text>

<circle cx="120" cy="108" r="4" fill="#0C3274"/><text x="98" y="112" text-anchor="end" class="pin-num">1</text>
<circle cx="780" cy="108" r="4" fill="#0C3274"/><text x="802" y="112" class="pin-num">1</text>
<line x1="126" y1="108" x2="774" y2="108" class="line-straight"/>

<circle cx="120" cy="126" r="4" fill="#0C3274"/><text x="98" y="130" text-anchor="end" class="pin-num">2</text>
<circle cx="780" cy="126" r="4" fill="#0C3274"/><text x="802" y="130" class="pin-num">2</text>
<line x1="126" y1="126" x2="774" y2="126" class="line-straight"/>

<circle cx="120" cy="144" r="4" fill="#0C3274"/><text x="98" y="148" text-anchor="end" class="pin-num">3</text>
<circle cx="780" cy="144" r="4" fill="#0C3274"/><text x="802" y="148" class="pin-num">3</text>
<line x1="126" y1="144" x2="774" y2="144" class="line-straight"/>

<circle cx="120" cy="162" r="4" fill="#0C3274"/><text x="98" y="166" text-anchor="end" class="pin-num">4</text>
<circle cx="780" cy="162" r="4" fill="#0C3274"/><text x="802" y="166" class="pin-num">4</text>
<line x1="126" y1="162" x2="774" y2="162" class="line-straight"/>

<circle cx="120" cy="180" r="4" fill="#0C3274"/><text x="98" y="184" text-anchor="end" class="pin-num">5</text>
<circle cx="780" cy="180" r="4" fill="#0C3274"/><text x="802" y="184" class="pin-num">5</text>
<line x1="126" y1="180" x2="774" y2="180" class="line-straight"/>

<circle cx="120" cy="198" r="4" fill="#0C3274"/><text x="98" y="202" text-anchor="end" class="pin-num">6</text>
<circle cx="780" cy="198" r="4" fill="#0C3274"/><text x="802" y="202" class="pin-num">6</text>
<line x1="126" y1="198" x2="774" y2="198" class="line-straight"/>

<circle cx="120" cy="216" r="4" fill="#0C3274"/><text x="98" y="220" text-anchor="end" class="pin-num">7</text>
<circle cx="780" cy="216" r="4" fill="#0C3274"/><text x="802" y="220" class="pin-num">7</text>
<line x1="126" y1="216" x2="774" y2="216" class="line-straight"/>

<circle cx="120" cy="234" r="4" fill="#0C3274"/><text x="98" y="238" text-anchor="end" class="pin-num">8</text>
<circle cx="780" cy="234" r="4" fill="#0C3274"/><text x="802" y="238" class="pin-num">8</text>
<line x1="126" y1="234" x2="774" y2="234" class="line-straight"/>

<!-- ===== Panel 2: Crossover ===== -->
<rect x="16" y="284" width="868" height="216" rx="6" class="panel"/>
<text x="32" y="308" class="lbl" style="font-size:13px;font-weight:600;">CROSSOVER (T-568A one end, T-568B the other)</text>
<text x="32" y="324" class="lbl-sm">Pins 1+2 (Transmit) swap with Pins 3+6 (Receive), so each side's transmit reaches the other's receive.</text>
<text x="120" y="344" text-anchor="middle" class="lbl-sm" style="font-weight:600;">Connector A</text>
<text x="780" y="344" text-anchor="middle" class="lbl-sm" style="font-weight:600;">Connector B</text>

<circle cx="120" cy="360" r="4" fill="#0C3274"/><text x="98" y="364" text-anchor="end" class="pin-num">1</text>
<circle cx="780" cy="360" r="4" fill="#0C3274"/><text x="802" y="364" class="pin-num">1</text>
<circle cx="120" cy="378" r="4" fill="#0C3274"/><text x="98" y="382" text-anchor="end" class="pin-num">2</text>
<circle cx="780" cy="378" r="4" fill="#0C3274"/><text x="802" y="382" class="pin-num">2</text>
<circle cx="120" cy="396" r="4" fill="#0C3274"/><text x="98" y="400" text-anchor="end" class="pin-num">3</text>
<circle cx="780" cy="396" r="4" fill="#0C3274"/><text x="802" y="400" class="pin-num">3</text>
<circle cx="120" cy="414" r="4" fill="#0C3274"/><text x="98" y="418" text-anchor="end" class="pin-num">4</text>
<circle cx="780" cy="414" r="4" fill="#0C3274"/><text x="802" y="418" class="pin-num">4</text>
<circle cx="120" cy="432" r="4" fill="#0C3274"/><text x="98" y="436" text-anchor="end" class="pin-num">5</text>
<circle cx="780" cy="432" r="4" fill="#0C3274"/><text x="802" y="436" class="pin-num">5</text>
<circle cx="120" cy="450" r="4" fill="#0C3274"/><text x="98" y="454" text-anchor="end" class="pin-num">6</text>
<circle cx="780" cy="450" r="4" fill="#0C3274"/><text x="802" y="454" class="pin-num">6</text>
<circle cx="120" cy="468" r="4" fill="#0C3274"/><text x="98" y="472" text-anchor="end" class="pin-num">7</text>
<circle cx="780" cy="468" r="4" fill="#0C3274"/><text x="802" y="472" class="pin-num">7</text>
<circle cx="120" cy="486" r="4" fill="#0C3274"/><text x="98" y="490" text-anchor="end" class="pin-num">8</text>
<circle cx="780" cy="486" r="4" fill="#0C3274"/><text x="802" y="490" class="pin-num">8</text>

<!-- crossed pairs: 1<->3, 2<->6, 3<->1, 6<->2 -->
<line x1="126" y1="360" x2="774" y2="396" class="line-cross"/>
<line x1="126" y1="378" x2="774" y2="450" class="line-cross"/>
<line x1="126" y1="396" x2="774" y2="360" class="line-cross"/>
<line x1="126" y1="450" x2="774" y2="378" class="line-cross"/>
<!-- straight pairs: 4,5,7,8 -->
<line x1="126" y1="414" x2="774" y2="414" class="line-straight"/>
<line x1="126" y1="432" x2="774" y2="432" class="line-straight"/>
<line x1="126" y1="468" x2="774" y2="468" class="line-straight"/>
<line x1="126" y1="486" x2="774" y2="486" class="line-straight"/>

<!-- ===== Panel 3: Rollover ===== -->
<rect x="16" y="520" width="868" height="216" rx="6" class="panel"/>
<text x="32" y="544" class="lbl" style="font-size:13px;font-weight:600;">ROLLOVER (console/management only - not Ethernet data)</text>
<text x="32" y="560" class="lbl-sm">Pin N on one end connects to pin (9-N) on the other: 1-8, 2-7, 3-6, 4-5 - every pin reverses. Carries RS-232 serial to a router/switch console port, not Ethernet.</text>
<text x="120" y="580" text-anchor="middle" class="lbl-sm" style="font-weight:600;">Connector A</text>
<text x="780" y="580" text-anchor="middle" class="lbl-sm" style="font-weight:600;">Connector B</text>

<circle cx="120" cy="596" r="4" fill="#0C3274"/><text x="98" y="600" text-anchor="end" class="pin-num">1</text>
<circle cx="780" cy="596" r="4" fill="#0C3274"/><text x="802" y="600" class="pin-num">1</text>
<circle cx="120" cy="614" r="4" fill="#0C3274"/><text x="98" y="618" text-anchor="end" class="pin-num">2</text>
<circle cx="780" cy="614" r="4" fill="#0C3274"/><text x="802" y="618" class="pin-num">2</text>
<circle cx="120" cy="632" r="4" fill="#0C3274"/><text x="98" y="636" text-anchor="end" class="pin-num">3</text>
<circle cx="780" cy="632" r="4" fill="#0C3274"/><text x="802" y="636" class="pin-num">3</text>
<circle cx="120" cy="650" r="4" fill="#0C3274"/><text x="98" y="654" text-anchor="end" class="pin-num">4</text>
<circle cx="780" cy="650" r="4" fill="#0C3274"/><text x="802" y="654" class="pin-num">4</text>
<circle cx="120" cy="668" r="4" fill="#0C3274"/><text x="98" y="672" text-anchor="end" class="pin-num">5</text>
<circle cx="780" cy="668" r="4" fill="#0C3274"/><text x="802" y="672" class="pin-num">5</text>
<circle cx="120" cy="686" r="4" fill="#0C3274"/><text x="98" y="690" text-anchor="end" class="pin-num">6</text>
<circle cx="780" cy="686" r="4" fill="#0C3274"/><text x="802" y="690" class="pin-num">6</text>
<circle cx="120" cy="704" r="4" fill="#0C3274"/><text x="98" y="708" text-anchor="end" class="pin-num">7</text>
<circle cx="780" cy="704" r="4" fill="#0C3274"/><text x="802" y="708" class="pin-num">7</text>
<circle cx="120" cy="722" r="4" fill="#0C3274"/><text x="98" y="726" text-anchor="end" class="pin-num">8</text>
<circle cx="780" cy="722" r="4" fill="#0C3274"/><text x="802" y="726" class="pin-num">8</text>

<!-- full mirror: pin i (left) -> pin 9-i (right) -->
<line x1="126" y1="596" x2="774" y2="722" class="line-roll"/>
<line x1="126" y1="614" x2="774" y2="704" class="line-roll"/>
<line x1="126" y1="632" x2="774" y2="686" class="line-roll"/>
<line x1="126" y1="650" x2="774" y2="668" class="line-roll"/>
<line x1="126" y1="668" x2="774" y2="650" class="line-roll"/>
<line x1="126" y1="686" x2="774" y2="632" class="line-roll"/>
<line x1="126" y1="704" x2="774" y2="614" class="line-roll"/>
<line x1="126" y1="722" x2="774" y2="596" class="line-roll"/>

<!-- legend -->
<line x1="32" y1="754" x2="64" y2="754" class="line-straight"/>
<text x="72" y="758" class="lbl-sm">Straight pin (unchanged)</text>
<line x1="260" y1="754" x2="292" y2="754" class="line-cross"/>
<text x="300" y="758" class="lbl-sm">Crossed pin (swapped for crossover)</text>
<line x1="580" y1="754" x2="612" y2="754" class="line-roll"/>
<text x="620" y="758" class="lbl-sm">Reversed pin (mirrored for rollover)</text>

<text x="16" y="778" class="lbl-sm" style="font-style:italic;">*Schematic layout - not a live photo. Pin numbering, the 1/2-3/6 crossover swap, and the full rollover reversal match the TIA/EIA-568 and RS-232 console conventions.</text>
</svg>
